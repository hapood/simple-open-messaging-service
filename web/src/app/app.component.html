@if (startup.restoring()) {
  <div class="app-splash" role="status">
    <img class="app-splash__mark" src="logo.svg" alt="" />
    <div class="app-splash__word">SOMS.im</div>
    @if (!startup.databaseFailure()) {
      <div class="app-splash__spinner"></div>
    }
  </div>
}
<app-indicator-slot>
  <app-connection-banner />
</app-indicator-slot>
@if (!startup.restoring()) {
  <router-outlet />
}
<app-update-banner />
<app-debug-log-fab />
@if (serverConfigDialog.visible()) {
  <app-material-dialog [isShow]="true">
    <div class="server-config-dialog-frame">
      <app-server-config-page
        [dialog]="true"
        (closed)="serverConfigDialog.close()"
      />
    </div>
  </app-material-dialog>
}
