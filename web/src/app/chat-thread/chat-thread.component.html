<div>
  <div class="chat-list" v-if="isReady">
    @for (item of messageList; track item.id){
    <div [ngClass]="['chat-list-item-wrapper',getClassName(item.creator)]">
      <div [ngClass]="['chat-list-item',getClassName(item.creator)]">
        <div>id:{{item.id}}|name:{{getName(item.creator)}}</div>
        <div>text:{{item.content}}</div>
        <div>datetime:{{item.createdAt}}</div>
      </div>
    </div>
    }
  </div>
  <div class="bottom-bar">
    <input [formControl]="inputTextControl" class="bottom-input" type="text" #input (keydown.enter)="send()" />
    <button (click)="send()">发送</button>
  </div>
</div>
