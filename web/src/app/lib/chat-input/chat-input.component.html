<form class="ci-input-bar" #inputBar (submit)="$event.preventDefault()" (keydown.escape)="closeEmoji()">
  <!-- Emoji panel — WhatsApp/Telegram-style: category tabs + scrollable grid. Floats above the bar; the
       native keyboard stays up on mobile (no VirtualKeyboard swap — hide() is broken on Chrome Android,
       crbug.com/40912131). Backdrop / Esc closes. The Recents tab is first when non-empty. -->
  <!-- ALWAYS MOUNTED (not behind @if): the panel and every category grid render ONCE at component init, so
       opening the panel and switching tabs are both pure CSS toggles with zero DOM creation/destruction. The
       panel hides via opacity+pointer-events (NOT display:none) so the grids stay painted and their glyphs stay
       rasterized — see chat-input.component.scss. [aria-hidden] keeps the closed panel out of the a11y tree
       (opacity alone would leave it reachable to AT). appPreventFocusSteal on the panel covers every button via
       mousedown bubbling (one directive, not ~440). -->
  <!-- Transparent mask: a click on the empty area closes the popup but does NOT steal focus (same directive on
       the backdrop). [hidden] removes it from layout + pointer events when the panel is closed. -->
  <div class="ci-backdrop" appPreventFocusSteal [hidden]="!emojiOpen()" (click)="closeEmoji()"></div>
  <div class="ci-emoji-panel" appPreventFocusSteal
       [class.ci-emoji-panel--open]="emojiOpen()"
       [attr.aria-hidden]="!emojiOpen()"
       (click)="$event.stopPropagation()" role="dialog" aria-label="Emoji">
    <div class="ci-emoji-tabs" role="tablist">
      @for (cat of emojiTabs(); track cat.id) {
        <button type="button" class="ci-emoji-tab"
                [class.ci-emoji-tab--active]="activeCategory() === cat.id"
                (click)="activeCategory.set(cat.id)" [attr.aria-label]="cat.label">{{ cat.icon }}</button>
      }
    </div>
    <!-- All category grids are always present; only the active one is opacity:1 + on top. Switching tabs toggles
         one class — no nodes re-created, no relayout, no glyph re-raster. One delegated (click) inserts via
         data-emoji. -->
    <div class="ci-emoji-grids" (click)="onGridClick($event)">
      @for (tab of emojiTabs(); track tab.id) {
        <div class="ci-emoji-grid"
             [class.ci-emoji-grid--active]="activeCategory() === tab.id">
          @for (e of tab.icons; track e) {
            <button type="button" class="ci-emoji" [attr.data-emoji]="e">{{ e }}</button>
          }
        </div>
      }
    </div>
  </div>
  <div class="ci-input-wrap">
    <button type="button" class="ci-input-ico" appPreventFocusSteal (click)="toggleEmoji()" aria-label="Emoji">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" /><path d="M8 14s1.5 2 4 2 4-2 4-2" />
        <line x1="9" y1="9" x2="9.01" y2="9" /><line x1="15" y1="9" x2="15.01" y2="9" />
      </svg>
    </button>
    <app-chat-editor class="ci-input" [members]="members()" [placeholder]="placeholder()"
                     (html)="onHtml($event)" (send)="onEditorSend()"></app-chat-editor>
    <button type="button" class="ci-input-ico" appPreventFocusSteal (click)="onFileClick()" aria-label="Send file">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
      </svg>
    </button>
  </div>
  <!-- Send key: draft present ⇒ paper plane (send text); empty ⇒ camera (open the image picker). Always brand
       colored; disabled (with [disabled]) while a send/upload is in flight. -->
  <button type="button" class="ci-send" appPreventFocusSteal [class.ci-send-media]="!draftHtml()" (click)="onSendClick()"
          [disabled]="sending()" [attr.aria-label]="draftHtml() ? 'Send' : 'Send image'">
    @if (draftHtml()) {
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" />
      </svg>
    } @else {
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
        <circle cx="12" cy="13" r="4" />
      </svg>
    }
  </button>
  <input #attachInput type="file" accept="image/*" multiple hidden (change)="onAttachChange($event)" />
  <input #fileInput type="file" hidden (change)="onFileChange($event)" />
</form>
