<form class="ci-input-bar" #inputBar (submit)="$event.preventDefault()" (keydown.escape)="closeEmoji()">
  @if (emojiOpen()) {
    <!-- Emoji panel — WhatsApp/Telegram-style: category tabs + scrollable grid. Floats above the bar; the
         native keyboard stays up on mobile (no VirtualKeyboard swap — hide() is broken on Chrome Android,
         crbug.com/40912131). Backdrop / Esc closes. The Recents tab is first when non-empty. -->
    <!-- Transparent mask: a click on the empty area closes the popup but does NOT steal focus
         (appPreventFocusSteal cancels mousedown's focus move), so the editor stays focused and the soft
         keyboard stays up — the user can keep typing. The `click` still fires → closeEmoji. -->
    <div class="ci-backdrop" appPreventFocusSteal (click)="closeEmoji()"></div>
    <div class="ci-emoji-panel" (click)="$event.stopPropagation()" role="dialog" aria-label="Emoji">
      <div class="ci-emoji-tabs" role="tablist">
        @for (cat of emojiTabs(); track cat.id) {
          <button type="button" class="ci-emoji-tab" appPreventFocusSteal
                  [class.ci-emoji-tab--active]="activeCategory() === cat.id"
                  (click)="activeCategory.set(cat.id)" [attr.aria-label]="cat.label">{{ cat.icon }}</button>
        }
      </div>
      <div class="ci-emoji-grid">
        @for (e of activeEmojis(); track e) {
          <button type="button" class="ci-emoji" appPreventFocusSteal (click)="insertEmoji(e)">{{ e }}</button>
        }
      </div>
    </div>
  }
  <div class="ci-input-wrap">
    <button type="button" class="ci-input-ico" appPreventFocusSteal (click)="toggleEmoji()" aria-label="Emoji">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" /><path d="M8 14s1.5 2 4 2 4-2 4-2" />
        <line x1="9" y1="9" x2="9.01" y2="9" /><line x1="15" y1="9" x2="15.01" y2="9" />
      </svg>
    </button>
    <app-chat-editor class="ci-input" [members]="members()" [placeholder]="placeholder()"
                     (html)="onHtml($event)" (send)="onEditorSend()"></app-chat-editor>
    <button type="button" class="ci-input-ico" appPreventFocusSteal (click)="onFileClick()" aria-label="Send file">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
      </svg>
    </button>
  </div>
  <!-- Send key: draft present ⇒ paper plane (send text); empty ⇒ camera (open the image picker). Always brand
       colored; disabled (with [disabled]) while a send/upload is in flight. -->
  <button type="button" class="ci-send" appPreventFocusSteal [class.ci-send-media]="!draftHtml()" (click)="onSendClick()"
          [disabled]="sending()" [attr.aria-label]="draftHtml() ? 'Send' : 'Send image'">
    @if (draftHtml()) {
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" />
      </svg>
    } @else {
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
        <circle cx="12" cy="13" r="4" />
      </svg>
    }
  </button>
  <input #attachInput type="file" accept="image/*" multiple hidden (change)="onAttachChange($event)" />
  <input #fileInput type="file" hidden (change)="onFileChange($event)" />
</form>
