<form class="ci-input-bar" #inputBar (submit)="$event.preventDefault()" (keydown.escape)="closeEmoji()">
  @if (!emojiKbd.supported() && emojiOpen()) {
    <!-- Popup fallback (iOS Safari / Firefox / desktop): floats ABOVE the bar; the native keyboard stays up.
         The Android Chromium swap renders a separate in-flow panel below the form instead. -->
    <div class="ci-backdrop" (click)="closeEmoji()"></div>
    <div class="ci-emoji-panel" (click)="$event.stopPropagation()">
      @for (e of emojisFlat; track e) {
        <button type="button" class="ci-emoji" appPreventFocusSteal (click)="insertEmoji(e)">{{ e }}</button>
      }
    </div>
  }
  <div class="ci-input-wrap">
    <button type="button" class="ci-input-ico" appPreventFocusSteal (click)="toggleEmoji()" aria-label="Emoji">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" /><path d="M8 14s1.5 2 4 2 4-2 4-2" />
        <line x1="9" y1="9" x2="9.01" y2="9" /><line x1="15" y1="9" x2="15.01" y2="9" />
      </svg>
    </button>
    <app-chat-editor class="ci-input" [members]="members()" [hasFinePointer]="hasFinePointer()" [placeholder]="placeholder()"
                     (html)="onHtml($event)" (send)="onEditorSend()"></app-chat-editor>
    <button type="button" class="ci-input-ico" appPreventFocusSteal (click)="onFileClick()" aria-label="Send file">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
      </svg>
    </button>
  </div>
  <!-- Send key: draft present ⇒ paper plane (send text); empty ⇒ camera (open the image picker). Always brand
       colored; disabled (with [disabled]) while a send/upload is in flight. -->
  <button type="button" class="ci-send" appPreventFocusSteal [class.ci-send-media]="!draftHtml()" (click)="onSendClick()"
          [disabled]="sending()" [attr.aria-label]="draftHtml() ? 'Send' : 'Send image'">
    @if (draftHtml()) {
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" />
      </svg>
    } @else {
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
        <circle cx="12" cy="13" r="4" />
      </svg>
    }
  </button>
  <input #attachInput type="file" accept="image/*" multiple hidden (change)="onAttachChange($event)" />
  <input #fileInput type="file" hidden (change)="onFileChange($event)" />
</form>
@if (emojiKbd.supported() && emojiKbd.open()) {
  <!-- Swap panel (Android Chromium): replaces the keyboard region. Height = the occlusion captured at toggle,
       so the message-list viewport keeps its exact size across the swap (kernel invariant — the panel fills
       precisely the space the keyboard vacated). ABC chip closes the panel and re-focuses the editor, whose
       manual-policy focus→show handler brings the native keyboard back. -->
  <div class="ci-vkb-panel" [style.height.px]="emojiKbd.frozenHeight()" role="dialog" aria-label="Emoji"
       (click)="$event.stopPropagation()">
    <div class="ci-vkb-tabs" role="tablist">
      @for (cat of categories; track cat.id) {
        <button type="button" class="ci-vkb-tab" appPreventFocusSteal
                [class.ci-vkb-tab--active]="activeCategory() === cat.id"
                (click)="activeCategory.set(cat.id)" [attr.aria-label]="cat.label">{{ cat.icons[0] }}</button>
      }
      <span class="ci-vkb-tabs-spacer"></span>
      <button type="button" class="ci-vkb-abc" appPreventFocusSteal (click)="closeEmojiAndFocus()"
              aria-label="Switch to keyboard">ABC</button>
    </div>
    <div class="ci-vkb-grid">
      @for (e of activeEmojis(); track e) {
        <button type="button" class="ci-vkb-emoji" appPreventFocusSteal (click)="insertEmoji(e)">{{ e }}</button>
      }
    </div>
  </div>
}
