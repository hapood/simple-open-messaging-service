<div class="auth-shell" appAuthViewport>
  <app-auth-brand aria-hidden="true"></app-auth-brand>
  <main class="form-pane">
    <app-auth-toolbar></app-auth-toolbar>
    <form (ngSubmit)="submit()" class="login-card">
      <div class="progress-slot">
        @if (isSubmitting()) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>}
      </div>

      <h1 class="login-title">{{ 'auth.setPasswordTitle' | transloco }}</h1>
      <p class="login-sub">{{ 'auth.setPasswordSub' | transloco }}</p>

      <div class="input-line">
        <mat-form-field class="field" appearance="fill">
          <mat-label>{{ 'auth.newPassword' | transloco }}</mat-label>
          <input matInput name="password" autocomplete="new-password" enterkeyhint="next" autofocus
            [type]="showPassword() ? 'text' : 'password'"
            [ngModel]="password()" (ngModelChange)="onPasswordInput($event)">
          <button mat-icon-button matSuffix type="button" (click)="togglePassword()"
            [attr.aria-label]="(showPassword() ? 'auth.hidePassword' : 'auth.showPassword') | transloco">
            <app-icon [type]="showPassword() ? AppIcon.EYE_OFF : AppIcon.EYE" [style]="{ width: '20px', height: '20px' }" />
          </button>
        </mat-form-field>
        <div class="hint">{{ passwordHint() }}</div>
      </div>

      <div class="input-line">
        <mat-form-field class="field" appearance="fill">
          <mat-label>{{ 'auth.passwordAgain' | transloco }}</mat-label>
          <input matInput name="password2" autocomplete="new-password" enterkeyhint="done"
            [type]="showPassword() ? 'text' : 'password'"
            [ngModel]="password2()" (ngModelChange)="onPassword2Input($event)">
        </mat-form-field>
      </div>

      <div class="error" role="alert">{{ resp() }}</div>

      <button mat-flat-button color="primary" type="submit" class="submit-btn" [disabled]="isDisabled()">
        {{ 'auth.setPasswordBtn' | transloco }}
      </button>
    </form>
  </main>
</div>
