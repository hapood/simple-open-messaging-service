<div class="auth-shell" appAuthViewport>
  <app-auth-brand aria-hidden="true"></app-auth-brand>
  <main class="form-pane">
    <app-auth-toolbar></app-auth-toolbar>
    <form (ngSubmit)="submit()" class="login-card">
      <div class="progress-slot">
        @if (isSubmitting()) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>}
      </div>

      <h1 class="login-title">{{ 'auth.otpTitle' | transloco }}</h1>
      <p class="login-sub">{{ 'auth.otpSub' | transloco }}</p>

      <mat-form-field class="field" appearance="fill">
        <mat-label>{{ 'auth.account' | transloco }}</mat-label>
        <input matInput name="account" autocomplete="username" enterkeyhint="next" autofocus
          [ngModel]="account()" (ngModelChange)="onAccountInput($event)">
      </mat-form-field>

      <mat-form-field class="field" appearance="fill">
        <mat-label>{{ 'auth.otpCode' | transloco }}</mat-label>
        <input matInput name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"
          enterkeyhint="go"
          [ngModel]="code()" (ngModelChange)="onCodeInput($event)">
      </mat-form-field>

      <div class="error" role="alert">{{ resp() }}</div>

      <button mat-flat-button color="primary" type="submit" class="submit-btn" [disabled]="isDisabled()">
        {{ 'auth.loginBtn' | transloco }}
      </button>

    </form>

    <!-- Footer row below the card: login-method switchers on the LEFT, server-config link on the RIGHT
      (Tauri only). Mirrors the QR page so the OTP and QR switch buttons share one position:
      outside the card, bottom-left. -->
    <div class="auth-footer">
      <div class="auth-footer__methods">
        @if (canPassword() || canQr()) {
          <app-auth-method-menu
            [password]="canPassword()"
            [qr]="canQr()"
            (passwordSelected)="jumpToPassword()"
            (qrSelected)="jumpToQr()"
          />
        }
      </div>
      @if (isTauri()) {
        <a mat-button class="server-link" routerLink="/config" replaceUrl>
          <app-icon matButtonIcon [type]="AppIcon.SETTINGS" [style]="{ width: '18px', height: '18px' }" />
          {{ 'serverConfig.entry' | transloco }}
        </a>
      }
    </div>
  </main>
</div>
