<div class="page-wrapper">
  <div class="thread-list-wrapper">
    <app-home-header>
      <div>SOMS</div>
    </app-home-header>
    <div class="thread-list">
      <app-thread-list [profile]="this.profile()"></app-thread-list>
    </div>
  </div>
  @if(isShowMsgTrd()===true){
  <div class="message-thread-wrapper">
    <app-message-thread [threadId]="curThreadId()"></app-message-thread>
  </div>
  }
  <app-root-popup></app-root-popup>
</div>
