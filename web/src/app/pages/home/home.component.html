<div class="page-wrapper">
  <div class="thread-list-wrapper">
    <app-home-header [onThreadListChanged]="refreshThreadList">
      <div>SOMS</div>
    </app-home-header>
    <div class="thread-list">
      <app-thread-list [profile]="this.profile()" [selectedId]="curUsrtrdId()"
        (onSelect)="onThreadSelect($event)"></app-thread-list>
    </div>
  </div>
  @if(isShowMsgTrd()===true){
  <div class="message-thread-wrapper">
    <app-message-thread [userThreadId]="curUsrtrdId()"></app-message-thread>
  </div>
  }
  <app-root-popup></app-root-popup>
</div>
