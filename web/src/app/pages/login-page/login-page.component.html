<div class="auth-shell">
  <app-auth-brand aria-hidden="true"></app-auth-brand>
  <main class="form-pane">
    <app-auth-toolbar></app-auth-toolbar>
    <app-login (onSuccess)="onSuccess()"></app-login>
    @if (isTauri()) {
      <a mat-button class="server-link" routerLink="/config">
        <app-icon [type]="AppIcon.SETTINGS" [style]="{ width: '18px', height: '18px' }" />
        {{ 'serverConfig.entry' | transloco }}
      </a>
    }
  </main>
</div>
