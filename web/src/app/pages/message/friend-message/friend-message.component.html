<div>
  <div class="msg-container">
    <app-message-header [name]="title()"></app-message-header>
    <div class="msg-scroll-container" (scroll)="onMsgScroll($event)" #msgScroller>
      <div class="msg-group-list" #groupPadding>
        @for (status of grpStatArrSig(); track groupList[$index].id){
        <div class="msg-group-wrapper">
          <app-msg-group [list]="groupList[$index].list" [nextStatus]="status" [nextHeight]="groupList[$index].height"
            [index]="$index"></app-msg-group>
        </div>
        }
      </div>
    </div>
    <app-msg-input-bar (onAfterSent)="onAfterSent()" [threadId]="threadIdNum"></app-msg-input-bar>
  </div>
</div>
