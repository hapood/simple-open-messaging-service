<div #groupWrapper [ngClass]="groupWrapperClass()">
  @for (item of displayList(); track item.id){
  @if(item.isSelf){

  <div [ngClass]="['msg-list-wrapper','msg-self']">
    <div [ngClass]="['msg-list-item','msg-self']">
      <div>id:{{item.id}}|name:{{item.creator}}</div>
      <div>text:{{item.content}}</div>
      <div>datetime:{{item.createdAt}}</div>
    </div>
    <app-user-avatar [type]="UserAvatarType.SELF"></app-user-avatar>
  </div>
  }@else {
  <div [ngClass]="['msg-list-wrapper','msg-friend']">
    <app-user-avatar [type]="UserAvatarType.OTHER"></app-user-avatar>
    <div [ngClass]="['msg-list-item','msg-friend']">
      <div>id:{{item.id}}|name:{{item.creator}}</div>
      <div>text:{{item.content}}</div>
      <div>datetime:{{item.createdAt}}</div>
    </div>
  </div>
  }
  }
</div>
