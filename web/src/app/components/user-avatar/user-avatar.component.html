@if (showImage()) {
  <img class="ua img" [src]="src()!" (error)="imgFailed.set(true)" role="img"
    [attr.aria-label]="name() + ' avatar'" />
} @else {
  <svg class="ua" viewBox="0 0 100 100" width="100%" height="100%" role="img" [attr.aria-label]="name() + ' avatar'">
    <rect x="0" y="0" width="100" height="100" rx="20" [attr.fill]="bg()" />
    <text x="50" y="50" text-anchor="middle" dominant-baseline="central">{{ initial() }}</text>
  </svg>
}
