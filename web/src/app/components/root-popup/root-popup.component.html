<app-material-dialog [isShow]="popupType()!==undefined">
  <div class="popup-header">
    @if(isShowBackBtn()){
    <button class="icon-btn" (click)="goBack()"><app-icon [type]="AppIconType.BACK"
        [style]="{width:'32px',height:'32px'}"></app-icon></button>}
    <div class="popup-title">{{popupTitle()}}</div>
  </div>
  <div class="popup-com-wrapper">
    @if(currentPopupCom()!==undefined){
    <ng-container *ngComponentOutlet="
        currentPopupCom();
        inputs: {subject:curSubject()};
      " />}
  </div>
</app-material-dialog>
