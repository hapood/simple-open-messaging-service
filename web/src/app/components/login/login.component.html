<form (ngSubmit)="login()" class="login-card">
  <div class="progress-slot">
    @if(isLoging()){
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>}
  </div>

  <h1 class="login-title">Login to SOMS</h1>
  <p class="login-sub">Welcome back, please sign in to continue</p>

  <mat-form-field class="field" appearance="fill">
    <mat-label>Username</mat-label>
    <input matInput name="uniqName" autocomplete="username" autofocus
      [ngModel]="uniqName()" (ngModelChange)="onUniqNameInput($event)">
  </mat-form-field>

  <mat-form-field class="field" appearance="fill">
    <mat-label>Password</mat-label>
    <input matInput name="password" autocomplete="current-password"
      [type]="showPassword() ? 'text' : 'password'"
      [ngModel]="password()" (ngModelChange)="onPasswordInput($event)">
    <button mat-icon-button matSuffix type="button" (click)="togglePassword()"
      [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
      <app-icon [type]="showPassword() ? AppIcon.EYE_OFF : AppIcon.EYE" [style]="{ width: '20px', height: '20px' }" />
    </button>
  </mat-form-field>

  <mat-checkbox class="keep-cb" [checked]="isKeepLogin()" (change)="isKeepLogin.set($event.checked)">Keep me logged in</mat-checkbox>

  <div class="error" role="alert">{{resp()}}</div>

  <button mat-raised-button color="primary" type="submit" class="submit-btn" [disabled]="isLoginBtnDisabled()">Login</button>

  <div class="alt-action">
    Don't have an account?
    <button type="button" class="link-btn" (click)="jumpToRegister()">Register</button>
  </div>
</form>
