<form (ngSubmit)="login()" class="login-wrapper">
  <div class="progress-wrapper">
    @if(isLoging()){
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>}
  </div>
  <div class="avatar-hero">
    <app-user-avatar [type]="UserAvatarType.SELF"></app-user-avatar>
  </div>
  <div class="title">Login to SOMS</div>
  <div class="input-line">
    <mat-form-field appearance="fill" style="width: 100%">
      <mat-label>Username</mat-label>
      <input matInput [ngModel]="uniqName()" (ngModelChange)="uniqName.set($event)" name="uniqName">
    </mat-form-field>
  </div>
  <div class="input-line">
    <mat-form-field appearance="fill" style="width: 100%">
      <mat-label>Password</mat-label>
      <input matInput type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password">
    </mat-form-field>
  </div>
  <div class="error">{{resp()}}</div>
  <mat-checkbox [checked]="isKeepLogin()" (change)="isKeepLogin.set($event.checked)">keep me logged in</mat-checkbox>
  <div class="bot-btns">
    <button mat-raised-button class="login-btn" type="submit" [disabled]="isLoginBtnDisabled()">Login</button>
    <button mat-button class="reg-btn" (click)="jumpToRegister()">Register</button>
  </div>
</form>
