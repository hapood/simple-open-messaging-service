<form (ngSubmit)="login()" class="login-wrapper">
  <div class="progress-wrapper">
    @if(isLoging()){
    <app-material-progress-linear />}
  </div>
  <div class="avatar-hero">
    <app-user-avatar [type]="UserAvatarType.SELF"></app-user-avatar>
  </div>
  <div class="title">Login to SOMS</div>
  <div class="input-line">
    <app-material-input [(text)]="uniqName" placeholder="Username"></app-material-input>
  </div>
  <div class="input-line">
    <app-material-input type="password" [(text)]="password" placeholder="Password" />
  </div>
  <div class="error">{{resp()}}</div>
  <app-material-checkbox [(checked)]="isKeepLogin">keep me logged in</app-material-checkbox>
  <div class="bot-btns">
    <app-material-button class="login-btn" type="submit" [disabled]="isLoginBtnDisabled()">Login</app-material-button>
    <app-material-button class="reg-btn" [styleType]="MaterialButtonType.TEXT"
      (click)="jumpToRegister()">Register</app-material-button>
  </div>
</form>
