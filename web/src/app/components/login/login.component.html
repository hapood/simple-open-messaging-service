<form (ngSubmit)="login()" class="login-card">
  <div class="progress-slot">
    @if (isLoging()) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
  </div>

  <h1 class="login-title">{{ 'auth.loginTitle' | transloco }}</h1>
  <p class="login-sub">{{ 'auth.loginSub' | transloco }}</p>

  <mat-form-field class="field" appearance="fill">
    <mat-label>{{ 'auth.account' | transloco }}</mat-label>
    <input
      matInput
      name="account"
      autocomplete="username"
      enterkeyhint="next"
      autofocus
      [ngModel]="account()"
      (ngModelChange)="onAccountInput($event)"
    />
  </mat-form-field>

  <mat-form-field class="field" appearance="fill">
    <mat-label>{{ 'auth.password' | transloco }}</mat-label>
    <input
      matInput
      name="password"
      autocomplete="current-password"
      enterkeyhint="go"
      [type]="showPassword() ? 'text' : 'password'"
      [ngModel]="password()"
      (ngModelChange)="onPasswordInput($event)"
    />
    <button
      mat-icon-button
      matSuffix
      type="button"
      (click)="togglePassword()"
      [attr.aria-label]="
        (showPassword() ? 'auth.hidePassword' : 'auth.showPassword') | transloco
      "
    >
      <app-icon
        [type]="showPassword() ? AppIcon.EYE_OFF : AppIcon.EYE"
        [style]="{ width: '20px', height: '20px' }"
      />
    </button>
  </mat-form-field>

  <button
    mat-flat-button
    color="primary"
    type="submit"
    class="submit-btn"
    [disabled]="isLoginBtnDisabled()"
  >
    {{ 'auth.loginBtn' | transloco }}
  </button>

  <!-- Always reserve two lines below the primary action. A localized login error can appear without
    changing the button's position; longer exceptional messages may still grow naturally. -->
  <div class="error-slot">
    <div class="error" role="alert">{{ resp() }}</div>
  </div>

  @if (config.registrationOpen()) {
    <div class="alt-action">
      {{ 'auth.loginAltQuestion' | transloco }}
      <button type="button" class="link-btn" (click)="jumpToRegister()">
        {{ 'auth.register' | transloco }}
      </button>
    </div>
  }
</form>
