<div [appFitDialog]="fitOpts">
  <div class="msg-header">
    <button
      class="icon-btn"
      [disabled]="submitting()"
      (click)="onBack()"
      [attr.aria-label]="'common.back' | transloco"
    >
      <app-icon
        [type]="AppIconType.BACK"
        [style]="{ width: '32px', height: '32px' }"
      ></app-icon>
    </button>
    <span class="title">{{ 'newGroup.title' | transloco }}</span>
    <span class="header-spacer" aria-hidden="true"></span>
  </div>

  <div class="panel">
    <div class="avatar-section">
      <div class="avatar-wrap">
        <app-user-avatar
          [type]="UserAvatarType.GROUP"
          [name]="name() || '?'"
          [src]="pendingAvatar()"
        ></app-user-avatar>
        <button
          class="avatar-edit"
          type="button"
          (click)="fileInput.click()"
          [disabled]="avatarUploading() || submitting()"
          [attr.aria-label]="'newGroup.setPhotoAria' | transloco"
        >
          @if (avatarUploading()) {
            <span class="spin"></span>
          } @else {
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
              />
              <circle cx="12" cy="13" r="4" />
            </svg>
          }
        </button>
      </div>
    </div>

    <div class="fields">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>{{ 'newGroup.groupNamePlaceholder' | transloco }}</mat-label>
        <input
          matInput
          type="text"
          autocomplete="off"
          [maxlength]="NAME_MAX"
          [disabled]="submitting()"
          [ngModel]="name()"
          (ngModelChange)="onNameInput($event)"
          (keydown.enter)="confirm()"
        />
        <mat-hint align="end">{{ name().length }} / {{ NAME_MAX }}</mat-hint>
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>{{ 'newGroup.groupDescPlaceholder' | transloco }}</mat-label>
        <textarea
          matInput
          rows="3"
          [maxlength]="DESC_MAX"
          [disabled]="submitting()"
          [ngModel]="description()"
          (ngModelChange)="onDescInput($event)"
        ></textarea>
        <mat-hint align="end">
          {{ description().length }} / {{ DESC_MAX }}
        </mat-hint>
      </mat-form-field>
    </div>

    <div class="panel-actions">
      <button
        mat-flat-button
        color="primary"
        [disabled]="submitting() || avatarUploading() || !name().trim()"
        (click)="confirm()"
      >
        {{
          (submitting() ? 'newGroup.creating' : 'newGroup.create') | transloco
        }}
      </button>
    </div>
  </div>

  <input
    #fileInput
    type="file"
    accept="image/*"
    hidden
    (change)="pickAvatar($any($event.target))"
  />
</div>
