<div>
  <div class="msg-container" appKbdOffset>
    <app-message-header
      [userMsgTrd]="userMsgTrd()"
      (searchJump)="onSearchJump($event)"
      (historyCleared)="onHistoryCleared()"
    ></app-message-header>

    <div class="msg-viewport" #viewport tabindex="0">
      <div class="msg-content" #content>
        <div class="msg-sentinel" #topSentinel></div>
      </div>
      @if (skeletonVisible()) {
        <!-- Initial-load shimmer skeleton: a sibling of .msg-content (not inside it) so it never enters the
             kernel's measured height model. Delay-gated (skeletonVisible) — shown only if the first batch is
             still in flight past ~300ms, so fast loads never flash it. Styles/shared markup live in the global
             _cb-skeleton partial, identical to the playground. -->
        <div class="cb-skeleton" aria-hidden="true">
          <div class="cb-sk-row cb-sk-in">
            <span class="cb-sk-avatar"></span>
            <span class="cb-sk-bubble" style="--cb-sk-w: 62%; --cb-sk-h: 56px"></span>
          </div>
          <div class="cb-sk-row cb-sk-out">
            <span class="cb-sk-bubble" style="--cb-sk-w: 45%; --cb-sk-h: 32px"></span>
            <span class="cb-sk-avatar"></span>
          </div>
          <div class="cb-sk-row cb-sk-in">
            <span class="cb-sk-avatar"></span>
            <span class="cb-sk-bubble" style="--cb-sk-w: 55%; --cb-sk-h: 80px"></span>
          </div>
          <div class="cb-sk-row cb-sk-out">
            <span class="cb-sk-bubble" style="--cb-sk-w: 50%; --cb-sk-h: 56px"></span>
            <span class="cb-sk-avatar"></span>
          </div>
          <div class="cb-sk-row cb-sk-in">
            <span class="cb-sk-avatar"></span>
            <span class="cb-sk-bubble" style="--cb-sk-w: 60%; --cb-sk-h: 32px"></span>
          </div>
          <div class="cb-sk-row cb-sk-out">
            <span class="cb-sk-bubble" style="--cb-sk-w: 42%; --cb-sk-h: 104px"></span>
            <span class="cb-sk-avatar"></span>
          </div>
          <div class="cb-sk-row cb-sk-in">
            <span class="cb-sk-avatar"></span>
            <span class="cb-sk-bubble" style="--cb-sk-w: 55%; --cb-sk-h: 56px"></span>
          </div>
          <div class="cb-sk-row cb-sk-out">
            <span class="cb-sk-bubble" style="--cb-sk-w: 48%; --cb-sk-h: 32px"></span>
            <span class="cb-sk-avatar"></span>
          </div>
          <div class="cb-sk-row cb-sk-in">
            <span class="cb-sk-avatar"></span>
            <span class="cb-sk-bubble" style="--cb-sk-w: 62%; --cb-sk-h: 80px"></span>
          </div>
          <div class="cb-sk-row cb-sk-out">
            <span class="cb-sk-bubble" style="--cb-sk-w: 45%; --cb-sk-h: 56px"></span>
            <span class="cb-sk-avatar"></span>
          </div>
          <div class="cb-sk-row cb-sk-in">
            <span class="cb-sk-avatar"></span>
            <span class="cb-sk-bubble" style="--cb-sk-w: 50%; --cb-sk-h: 32px"></span>
          </div>
          <div class="cb-sk-row cb-sk-out">
            <span class="cb-sk-bubble" style="--cb-sk-w: 55%; --cb-sk-h: 80px"></span>
            <span class="cb-sk-avatar"></span>
          </div>
          <div class="cb-sk-row cb-sk-in">
            <span class="cb-sk-avatar"></span>
            <span class="cb-sk-bubble" style="--cb-sk-w: 58%; --cb-sk-h: 56px"></span>
          </div>
          <div class="cb-sk-row cb-sk-out">
            <span class="cb-sk-bubble" style="--cb-sk-w: 44%; --cb-sk-h: 104px"></span>
            <span class="cb-sk-avatar"></span>
          </div>
          <div class="cb-sk-row cb-sk-in">
            <span class="cb-sk-avatar"></span>
            <span class="cb-sk-bubble" style="--cb-sk-w: 52%; --cb-sk-h: 32px"></span>
          </div>
          <div class="cb-sk-row cb-sk-out">
            <span class="cb-sk-bubble" style="--cb-sk-w: 50%; --cb-sk-h: 56px"></span>
            <span class="cb-sk-avatar"></span>
          </div>
        </div>
      }
    </div>

    <!-- The floating date pill always tracks the topmost visible message. Search now lives inside the
         header (no added height), so it never collides with the pill and the pill stays visible during
         search — preserving date context while jumping between matches. -->
    <app-sticky-date-overlay [label]="stickyDate()" />

    @if (blockedPeer()) {
      <div class="msg-blocked-banner" (click)="unblockPeer()">
        {{ 'chat.blockedBanner' | transloco }}
      </div>
    } @else {
      <app-chat-input
        [members]="[]"
        [style.--kbd-lift]="(kbdOffset()?.offset() ?? 0) + 'px'"
        (send)="onSendIntent($event)"
      ></app-chat-input>
    }
  </div>
</div>
