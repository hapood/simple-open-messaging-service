<mat-sidenav-container class="nav-drawer-container">
  <mat-sidenav #nav class="nav-drawer" mode="over" position="start"
    (openedChange)="drawerOpenChange.emit($event)">
    <div class="drawer-header">
      <button class="avatar" type="button" (click)="editProfile()" [attr.aria-label]="'nav.editProfileAria' | transloco">
        <app-user-avatar [type]="UserAvatarType.SELF" [name]="sessionProfile()?.name || 'SOMS'"
          [src]="sessionProfile()?.avatar" />
      </button>
      <div class="user-name">{{ sessionProfile()?.name || 'SOMS' }}</div>
    </div>

    <nav class="drawer-menu">
      <button class="nav-item" (click)="friendRequests()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <line x1="19" y1="8" x2="19" y2="14" />
          <line x1="22" y1="11" x2="16" y2="11" />
        </svg>
        <span>{{ 'nav.friendRequests' | transloco }}</span>
        @if (sessionProfile()?.hasUrFriendReq) {
          <span class="friend-badge" [attr.aria-label]="'nav.newFriendRequestsAria' | transloco"></span>
        }
      </button>

      <button class="nav-item" (click)="newGroup()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        <span>{{ 'nav.newGroup' | transloco }}</span>
      </button>

      <button class="nav-item" (click)="folderEditor()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        </svg>
        <span>{{ 'nav.folders' | transloco }}</span>
      </button>
    </nav>

    <!-- Telegram-style pinned footer: a Settings row + a circular quick theme toggle pinned to the
         bottom, separated from the navigation body by a divider — mirrors Telegram's drawer footer
         (Settings + night-mode toggle in the bottom corner). The body above scrolls independently
         (flex:1 + overflow-y:auto) so the footer stays pinned however long the menu grows. -->
    <div class="drawer-footer">
      <button class="nav-item footer-item" (click)="settings()"
        [attr.aria-label]="'nav.settings' | transloco" [title]="'nav.settings' | transloco">
        <app-icon [type]="AppIconType.SETTINGS" [style]="{ width: '24px', height: '24px' }"></app-icon>
        <span>{{ 'nav.settings' | transloco }}</span>
      </button>
      <button class="theme-toggle" (click)="cycleTheme()"
        [attr.aria-label]="'nav.themeAria' | transloco:{ label: themeLabel() }"
        [title]="'nav.themeAria' | transloco:{ label: themeLabel() }">
        <app-icon [type]="themeIcon()" [style]="{ width: '24px', height: '24px' }"></app-icon>
      </button>
    </div>
  </mat-sidenav>
</mat-sidenav-container>
