<mat-sidenav-container class="nav-drawer-container">
  <mat-sidenav #nav class="nav-drawer" mode="over" position="start"
    (openedChange)="drawerOpenChange.emit($event)">
    <div class="drawer-header">
      <button class="avatar" type="button" (click)="editProfile()" aria-label="编辑资料">
        <app-user-avatar [type]="UserAvatarType.SELF" [name]="sessionProfile()?.uniqName || 'SOMS'"
          [src]="sessionProfile()?.userExtra?.avatar" />
      </button>
      <div class="user-name">{{ sessionProfile()?.userExtra?.name || sessionProfile()?.uniqName || 'SOMS' }}</div>
    </div>

    <nav class="drawer-menu">
      <button class="nav-item" (click)="friendRequests()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" />
        </svg>
        <span>好友请求</span>
        @if (sessionProfile()?.userNotiBox?.hasUrFriendReq) {
          <span class="friend-badge" aria-label="new friend requests"></span>
        }
      </button>

      <button class="nav-item" (click)="newGroup()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 8v8M8 12h8" />
        </svg>
        <span>新建群组</span>
      </button>

      <button class="nav-item" (click)="folderEditor()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        </svg>
        <span>文件夹</span>
      </button>

      <div class="nav-spacer"></div>

      <button class="nav-item danger" (click)="logout()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <path d="M16 17l5-5-5-5" />
          <path d="M21 12H9" />
        </svg>
        <span>登出</span>
      </button>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <ng-content></ng-content>
  </mat-sidenav-content>
</mat-sidenav-container>
