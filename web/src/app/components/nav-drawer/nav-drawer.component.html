<mat-sidenav-container class="nav-drawer-container">
  <mat-sidenav #nav class="nav-drawer" mode="over" position="start"
    (openedChange)="drawerOpenChange.emit($event)">
    <div class="drawer-header">
      <button class="avatar" type="button" (click)="editProfile()" aria-label="Edit profile">
        <app-user-avatar [type]="UserAvatarType.SELF" [name]="sessionProfile()?.uniqName || 'SOMS'"
          [src]="sessionProfile()?.userExtra?.avatar" />
      </button>
      <div class="user-name">{{ sessionProfile()?.userExtra?.name || sessionProfile()?.uniqName || 'SOMS' }}</div>
    </div>

    <nav class="drawer-menu">
      <button class="nav-item" (click)="friendRequests()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <line x1="19" y1="8" x2="19" y2="14" />
          <line x1="22" y1="11" x2="16" y2="11" />
        </svg>
        <span>Friend requests</span>
        @if (sessionProfile()?.userNotiBox?.hasUrFriendReq) {
          <span class="friend-badge" aria-label="new friend requests"></span>
        }
      </button>

      <button class="nav-item" (click)="newGroup()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        <span>New group</span>
      </button>

      <button class="nav-item" (click)="folderEditor()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        </svg>
        <span>Folders</span>
      </button>

      <button class="nav-item" (click)="cycleTheme()"
        [attr.aria-label]="'Theme: ' + themeLabel()" [title]="'Theme: ' + themeLabel()">
        <app-icon [type]="themeIcon()" [style]="{ width: '24px', height: '24px' }"></app-icon>
        <span>{{ themeLabel() }}</span>
      </button>

      <div class="nav-spacer"></div>

      <button class="nav-item danger" (click)="logout()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <path d="M16 17l5-5-5-5" />
          <path d="M21 12H9" />
        </svg>
        <span>Log out</span>
      </button>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <ng-content></ng-content>
  </mat-sidenav-content>
</mat-sidenav-container>
