<div class="shell"
     [class.mode-desktop]="mode() === 'desktop'"
     [class.mode-tablet]="mode() === 'tablet'"
     [class.mode-mobile]="mode() === 'mobile'"
     [class.chat-open]="chatActive()"
     [class.aside-open]="asideActive()">
  @if (mode() === 'desktop') {
    <app-icon-rail class="rail" [onThreadListChanged]="refresh" />
    <app-chat-list-pane class="list" [style.width.px]="listWidth()" (selectThread)="openChat($event)" />
    <div class="resizer" (mousedown)="startResize($event)" (dblclick)="resetWidth()"
         title="Drag to resize; double-click to reset"></div>
  } @else {
    <div class="drawer-body">
      <app-home-header class="header" (toggleDrawer)="nav.toggle()" />
      <app-chat-list-pane class="list" (selectThread)="openChat($event)" />
    </div>
    <!-- nav-drawer is a shell-level overlay (position:fixed host), NOT a wrapper around the list:
         rendering it as a sibling keeps its backdrop global (full-viewport mask over the inline
         chat too) instead of scoped to the thread-list column. -->
    <app-nav-drawer #nav [onThreadListChanged]="refresh" />
  }

  <!-- primary chat surface: ChatPane is always-mounted (NO router-outlet — the NavStateMachineService
       drives which thread it shows via ConversationListService.openThreadId). On mobile [@overlaySlide]
       glides this overlay in/out from the right; on desktop/tablet it stays `static` (inline flex column). -->
  <div class="chat-slot"
       [@overlaySlide]="chatSlotState()"
       (@overlaySlide.start)="onSlideStart($event)"
       (@overlaySlide.done)="onSlideDone($event, 'chat')"><app-chat-pane /></div>
  <!-- aside panel (peer-profile / group-info / settings): rendered by @switch on nav.aside().panel — NO
       named router-outlet. Slides in from the right on mobile (over the chat); desktop side panel and
       tablet absolute overlay stay `static`. -->
  <div class="aside-slot"
       [@overlaySlide]="asideSlotState()"
       (@overlaySlide.start)="onSlideStart($event)"
       (@overlaySlide.done)="onSlideDone($event, 'aside')">
    @switch (asidePanel()) {
      @case ('profile') { <app-peer-profile /> }
      @case ('group-info') { <app-group-info /> }
      @case ('settings') { <app-settings /> }
    }
  </div>

  <!-- Scrim behind the aside drawer on desktop + tablet (click → close). Mobile's aside slides over a
       full-screen chat so no mask is needed there; the nav-drawer uses its own mat-sidenav backdrop. -->
  @if ((mode() === 'desktop' || mode() === 'tablet') && asideActive()) {
    <div class="drawer-mask" (click)="closeAside()" aria-hidden="true"></div>
  }
</div>
