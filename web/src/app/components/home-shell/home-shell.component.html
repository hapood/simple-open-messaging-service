<div class="shell"
     [class.mode-desktop]="mode() === 'desktop'"
     [class.mode-tablet]="mode() === 'tablet'"
     [class.mode-mobile]="mode() === 'mobile'"
     [class.chat-open]="chatActive()"
     [class.aside-open]="asideActive()">
  <app-connection-banner />
  <app-update-banner />
  @if (mode() === 'desktop') {
    <app-icon-rail class="rail" [onThreadListChanged]="refresh" />
    <app-chat-list-pane class="list" [style.width.px]="listWidth()" (selectThread)="openChat($event)" />
    <div class="resizer" (mousedown)="startResize($event)" (dblclick)="resetWidth()"
         title="Drag to resize; double-click to reset"></div>
  } @else {
    <app-nav-drawer #d class="drawer" [onThreadListChanged]="refresh">
      <div class="drawer-body">
        <app-home-header class="header" (toggleDrawer)="d.toggle()" />
        <app-chat-list-pane class="list" (selectThread)="openChat($event)" />
      </div>
    </app-nav-drawer>
  }

  <!-- primary chat surface: ChatPane (routed). ChatReuseStrategy reuses the instance across `''` ↔
       `chat/:threadId`, so it's effectively always-mounted (the kernel never remounts on open/close). On
       mobile [@overlaySlide] glides this overlay in/out from the right; on desktop/tablet it stays `static`
       (inline flex column). -->
  <div class="chat-slot"
       [@overlaySlide]="chatSlotState()"
       (@overlaySlide.start)="onSlideStart($event)"
       (@overlaySlide.done)="onSlideDone($event, 'chat')"><router-outlet /></div>
  <!-- named outlet: peer-profile / group-info. Slides in from the right on mobile (over the chat); the
       desktop side panel and tablet absolute overlay stay `static`. -->
  <div class="aside-slot"
       [@overlaySlide]="asideSlotState()"
       (@overlaySlide.start)="onSlideStart($event)"
       (@overlaySlide.done)="onSlideDone($event, 'aside')"><router-outlet name="aside" /></div>
</div>
