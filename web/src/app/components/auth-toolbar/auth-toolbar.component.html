<button class="toggle" type="button" (click)="cycleTheme()"
  [attr.aria-label]="'auth.themeAria' | transloco:{ label: themeLabel() }"
  [title]="'auth.themeAria' | transloco:{ label: themeLabel() }">
  <app-icon [type]="themeIcon()" [style]="{ width: '22px', height: '22px' }"></app-icon>
</button>

<button class="toggle" type="button" (click)="cycleLang()"
  [attr.aria-label]="'auth.languageAria' | transloco:{ label: langLabel() }"
  [title]="'auth.languageAria' | transloco:{ label: langLabel() }">
  <app-icon [type]="AppIconType.GLOBE" [style]="{ width: '22px', height: '22px' }"></app-icon>
</button>
