<form (ngSubmit)="register()" class="register-card">
  <div class="progress-slot">
    @if(isReging()){
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>}
  </div>

  <h1 class="register-title">Create your account</h1>
  <p class="register-sub">Join SOMS in just a few seconds</p>

  <div class="input-line">
    <mat-form-field class="field" appearance="fill">
      <mat-label>Username</mat-label>
      <input matInput name="uniqName" autocomplete="username" autofocus
        [ngModel]="uniqName()" (ngModelChange)="onUniqNameInput($event)">
    </mat-form-field>
    <div class="hint">{{uniqNameHint()}}</div>
  </div>

  <div class="input-line">
    <mat-form-field class="field" appearance="fill">
      <mat-label>Password</mat-label>
      <input matInput name="password" autocomplete="new-password"
        [type]="showPassword() ? 'text' : 'password'"
        [ngModel]="password()" (ngModelChange)="onPasswordInput($event)">
      <button mat-icon-button matSuffix type="button" (click)="togglePassword()"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
        <app-icon [type]="showPassword() ? AppIcon.EYE_OFF : AppIcon.EYE" [style]="{ width: '20px', height: '20px' }" />
      </button>
    </mat-form-field>
  </div>

  <div class="input-line">
    <mat-form-field class="field" appearance="fill">
      <mat-label>Password Again</mat-label>
      <input matInput name="password2" autocomplete="new-password"
        [type]="showPassword() ? 'text' : 'password'"
        [ngModel]="password2()" (ngModelChange)="onPassword2Input($event)">
    </mat-form-field>
    <div class="hint">{{passwordHint()}}</div>
  </div>

  <div class="error" role="alert">{{resp()}}</div>

  <button mat-raised-button color="primary" type="submit" class="submit-btn" [disabled]="isRegBtnDisabled()">Sign up</button>

  <div class="alt-action">
    Already have an account?
    <button type="button" class="link-btn" (click)="jumpToLogin()">Login</button>
  </div>
</form>
