<form (ngSubmit)="register()" class="register-wrapper">
  <div class="progress-wrapper">
    @if(isReging()){
    <app-material-progress-linear />}
  </div>
  <svg fill="#000000" width="120px" height="120px" viewBox="0 0 24 24" id="sign-alt" data-name="Flat Line"
    xmlns="http://www.w3.org/2000/svg" class="icon flat-line">
    <path id="secondary" d="M4,9H20a1,1,0,0,1,1,1V21a0,0,0,0,1,0,0H3a0,0,0,0,1,0,0V10A1,1,0,0,1,4,9Z"
      style="fill: rgb(44, 169, 188); stroke-width: 2;"></path>
    <polyline id="primary" points="18 9 12 3 6 9"
      style="fill: none; stroke: rgb(0, 0, 0); stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;">
    </polyline>
    <path id="primary-2" data-name="primary" d="M8,13h8m-6,4h4m7-7a1,1,0,0,0-1-1H4a1,1,0,0,0-1,1V21H21Z"
      style="fill: none; stroke: rgb(0, 0, 0); stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;"></path>
  </svg>
  <div class="input-line">
    <app-material-input [(text)]="uniqName" placeholder="Username"></app-material-input>
    <div class="err-hint">{{uniqNameHint()}}</div>
  </div>
  <div class="input-line">
    <app-material-input type="password" [(text)]="password" placeholder="Password" autocomplete="new-password" />
  </div>
  <div class="input-line">
    <app-material-input type="password" [(text)]="password2" placeholder="Password Again" autocomplete="new-password" />
    <div class="err-hint">{{passwordHint()}}</div>
  </div>
  <app-material-button type="submit" class="sub-btn" [disabled]="isRegBtnDisabled()">Sign up</app-material-button>
  <div class="error">{{resp()}}</div>
</form>
