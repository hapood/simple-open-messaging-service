<button
  mat-button
  type="button"
  [matMenuTriggerFor]="methods"
>
  {{ 'auth.otherMethods' | transloco }}
  <app-icon
    class="chevron"
    aria-hidden="true"
    [type]="AppIcon.CHEVRON_DOWN"
    [style]="{ width: '16px', height: '16px' }"
  />
</button>

<mat-menu #methods="matMenu">
  @if (password()) {
    <button mat-menu-item type="button" (click)="passwordSelected.emit()">
      {{ 'auth.switchToPassword' | transloco }}
    </button>
  }
  @if (otp()) {
    <button
      mat-menu-item
      type="button"
      (click)="otpSelected.emit()"
    >
      {{ 'auth.switchToOtp' | transloco }}
    </button>
  }
  @if (qr()) {
    <button mat-menu-item type="button" (click)="qrSelected.emit()">
      {{ 'auth.switchToQr' | transloco }}
    </button>
  }
</mat-menu>
