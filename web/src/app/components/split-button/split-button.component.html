<div class="split-button" role="group">
  <button
    mat-flat-button
    type="button"
    class="split-button__primary"
    [disabled]="disabled()"
    (click)="primaryAction.emit()"
  >
    {{ label() }}
  </button>
  <button
    mat-flat-button
    type="button"
    class="split-button__menu-trigger"
    [disabled]="disabled()"
    [matMenuTriggerFor]="actions"
    [attr.aria-label]="menuAriaLabel()"
    aria-haspopup="menu"
  >
    <app-icon [type]="AppIconType.CHEVRON_DOWN" />
  </button>
</div>

<mat-menu #actions="matMenu" xPosition="before">
  @for (option of options(); track option.value) {
    <button
      mat-menu-item
      type="button"
      [disabled]="option.disabled"
      (click)="optionAction.emit(option.value)"
    >
      <span class="split-button__option">
        <span>{{ option.label }}</span>
        @if (option.value === selectedValue()) {
          <app-icon [type]="AppIconType.CHECK" aria-hidden="true" />
        }
      </span>
    </button>
  }
</mat-menu>
