@if (avatarDraft(); as file) {
  <app-avatar-editor
    class="embedded-avatar-editor"
    [file]="file"
    [embedded]="true"
    (canceled)="cancelAvatarEdit()"
    (completed)="finishAvatarEdit($event)"
  />
} @else {
  <div class="profile-editor">
    <app-page-header
      [title]="'profile.editTitle' | transloco"
      [safeArea]="respectTopSafeArea()"
      (back)="goBack()"
    >
      <button
        pageHeaderAction
        mat-button
        color="primary"
        class="save-btn"
        (click)="save()"
        [disabled]="!canSave() && !justSaved()"
      >
        @if (justSaved()) {
          <app-icon
            [type]="AppIconType.CHECK"
            [style]="{ width: '18px', height: '18px' }"
          />
          <span>{{ 'common.saved' | transloco }}</span>
        } @else {
          {{ 'common.save' | transloco }}
        }
      </button>
    </app-page-header>

    <div class="body">
      <div class="avatar-wrap">
        <div class="avatar">
          <app-user-avatar
            [type]="UserAvatarType.SELF"
            [loading]="!sessionProfile()"
            [name]="name() || sessionProfile()?.account"
            [identityId]="$safeNavigationMigration(sessionProfile()?.id)"
            [src]="$safeNavigationMigration(sessionProfile()?.avatar)"
          />
          <button
            class="avatar-edit"
            type="button"
            (click)="fileInput.click()"
            [disabled]="uploading()"
            [attr.aria-label]="'profile.changeAvatarAria' | transloco"
          >
            <span class="avatar-hint">
              @if (uploading()) {
                <span class="spin"></span>
              } @else {
                {{ 'group.changeAvatarHint' | transloco }}
              }
            </span>
          </button>
        </div>
        <input
          #fileInput
          type="file"
          accept="image/*"
          hidden
          (change)="onAvatarPicked($event)"
        />
        @if (sessionProfile()?.account; as account) {
          <div class="account-identity">
            <span>{{ 'profile.account' | transloco }}</span>
            <strong>{{ account }}</strong>
          </div>
        }
      </div>

      <mat-form-field appearance="outline" class="field">
        <mat-label>{{ 'profile.name' | transloco }}</mat-label>
        <input
          matInput
          autocomplete="nickname"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          maxlength="30"
          [placeholder]="'profile.namePlaceholder' | transloco"
        />
        @if (nameHint()) {
          <mat-error>{{ nameHint() }}</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="field bio-field">
        <mat-label>{{ 'profile.bio' | transloco }}</mat-label>
        <textarea
          matInput
          rows="3"
          [ngModel]="bio()"
          (ngModelChange)="bio.set($event)"
          maxlength="120"
          [placeholder]="'profile.bioPlaceholder' | transloco"
        ></textarea>
        <mat-hint align="end">{{ bio().length }}/120</mat-hint>
      </mat-form-field>

      <div class="account-actions">
        <button
          mat-stroked-button
          color="warn"
          class="logout-btn"
          (click)="onLogout()"
          [attr.aria-label]="'nav.logout' | transloco"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="M16 17l5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
          <span>{{ 'nav.logout' | transloco }}</span>
        </button>
      </div>
    </div>
  </div>
}
