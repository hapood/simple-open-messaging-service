<div>@for (thread of dispThreadList(); track thread.id) {
  <button type="button" class="thread-item"
    [attr.aria-pressed]="thread.selected === true"
    (click)="onUsrTrdClick(thread)">
    <div class="thread-avatar">
      <app-user-avatar [type]="UserAvatarType.OTHER" [name]="thread.peerUser.name"
        [identityId]="thread.peerUser.id" [src]="thread.peerUser.avatar"></app-user-avatar>
      @if (thread.selected === true) {
        <span class="check" aria-hidden="true">
          <app-icon [type]="AppIconType.CHECK" [style]="{ width: '13px', height: '13px' }"></app-icon>
        </span>
      }
    </div>
    <div class="thread-info">
      <div class="thread-name">{{ thread.peerUser.name }}</div>
      @if (thread.peerUser.isForeigner) {
        <app-federated-badge class="thread-fed" [domain]="thread.peerUser.domain"></app-federated-badge>
      }
    </div>
  </button>
  }
</div>
