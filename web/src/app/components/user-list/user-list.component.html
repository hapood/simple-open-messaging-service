<div>
  @for (thread of dispThreadList(); track thread.threadId) {
    <button
      type="button"
      class="thread-item"
      [attr.aria-pressed]="thread.selected === true"
      (click)="onUsrTrdClick(thread)"
    >
      <div class="thread-avatar">
        <app-user-avatar
          [type]="UserAvatarType.OTHER"
          [name]="thread.peerUser.name"
          [identityId]="thread.peerUser.id"
          [account]="thread.peerUser.account"
          [src]="thread.peerUser.avatar"
          [federatedDomain]="
            thread.peerUser.isForeigner ? thread.peerUser.domain : null
          "
        ></app-user-avatar>
        @if (thread.selected === true) {
          <span class="check" aria-hidden="true">
            <app-icon
              [type]="AppIconType.CHECK"
              [style]="{ width: '13px', height: '13px' }"
            ></app-icon>
          </span>
        }
      </div>
      <div class="thread-info">
        <div class="thread-name">{{ thread.peerUser.name }}</div>
      </div>
    </button>
  }
</div>
