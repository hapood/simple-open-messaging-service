<div class="home-header">
  <button class="icon-btn" (click)="toggleDrawer.emit()" [attr.aria-label]="'home.openMenuAria' | transloco">
    <app-icon [type]="AppIconType.MENU" [style]="{width:'32px',height:'32px'}"></app-icon>
  </button>
  <div class="title">{{ 'common.appName' | transloco }}</div>
  <button class="icon-btn" (click)="search.open()" [attr.aria-label]="'home.searchAria' | transloco">
    <app-icon [type]="AppIconType.SEARCH" [style]="{width:'32px',height:'32px'}"></app-icon>
  </button>
</div>
