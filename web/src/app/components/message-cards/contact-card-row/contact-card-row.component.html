@if (showDate()) {
  <app-msg-date-row [ms]="data().createdAtMs" />
}
<div
  class="msg-row msg-{{ side() }}{{ showAvatar() ? ' msg-has-avatar' : '' }}{{
    isGroupStart() ? ' msg-group-start' : ''
  }} msg-grp-{{ isShowHead() ? 'head' : 'body' }}"
>
  <span class="msg-highlight-layer" aria-hidden="true"></span>
  @if (showAvatar() && side() === 'other') {
    <div class="msg-avatar">
      <app-user-avatar
        [type]="UserAvatarType.OTHER"
        [name]="data().name"
        [p2pThreadId]="data().isGroupConversation ? undefined : data().threadId"
        [account]="data().avatarAccount"
        [domainSource]="data().avatarDomainSource"
        [federatedDomain]="data().avatarDomain"
        [profileEvidence]="data().profileEvidence"
        [src]="data().snapshotAvatarUrl"
      />
    </div>
  }
  <div class="msg-col msg-{{ side() }}">
    @if (showName()) {
      <div class="msg-name msg-{{ side() }}">{{ data().name }}</div>
    }
    <button
      type="button"
      class="msg-bubble msg-card msg-{{ side() }} msg-{{ pos() }} contact-card"
      [disabled]="!card()"
      (click)="openCard()"
    >
      <div class="contact-card-body">
        @if (card(); as contact) {
          <app-user-avatar
            [type]="cardAvatarType()"
            [name]="contact.displayName"
            [account]="contact.account"
            [federatedDomain]="cardFederatedDomain()"
            [src]="contact.avatar"
          />
          <div class="contact-card-copy">
            <div class="contact-card-recommend">
              {{ data().name
              }}{{
                (isGroupCard()
                  ? 'contactCard.recommendedGroup'
                  : 'contactCard.recommendedPerson'
                ) | transloco
              }}
            </div>
            <div class="contact-card-name">{{ contact.displayName }}</div>
          </div>
        } @else {
          <div class="contact-card-copy">
            {{ 'contactCard.unavailable' | transloco }}
          </div>
        }
      </div>
      <div class="contact-card-meta msg-card-meta msg-{{ side() }}">
        <span>{{
          (isGroupCard() ? 'contactCard.groupLabel' : 'contactCard.label')
            | transloco
        }}</span
        ><span>{{ data().time }}</span>
      </div>
    </button>
  </div>
  @if (showAvatar() && side() === 'self') {
    <div class="msg-avatar">
      <app-user-avatar
        [type]="UserAvatarType.SELF"
        [name]="data().name"
        [account]="data().avatarAccount"
        [domainSource]="data().avatarDomainSource"
        [federatedDomain]="data().avatarDomain"
        [src]="data().snapshotAvatarUrl"
      />
    </div>
  }
</div>
