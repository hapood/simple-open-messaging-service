@if (showDate()) {
  <app-msg-date-row [ms]="data().createdAtMs" />
}

<div
  class="msg-row msg-{{ side() }}{{ showAvatar() ? ' msg-has-avatar' : '' }}{{ isGroupStart() ? ' msg-group-start' : '' }} msg-grp-{{ isShowHead() ? 'head' : 'body' }}"
>
  @if (showAvatar() && side() === 'other') {
    <div class="msg-avatar"><app-user-avatar [type]="UserAvatarType.OTHER" [name]="data().name" /></div>
  }

  <div class="msg-col msg-{{ side() }}">
    @if (showName()) {
      <div class="msg-name msg-{{ side() }}">{{ data().name || ('common.unknown' | transloco) }}</div>
    }
    <button
      type="button"
      class="msg-bubble msg-{{ side() }} msg-{{ pos() }} invite invite-tappable"
      [class.invite-expired]="status() === 1"
      (click)="openDetail()"
    >
      <div class="invite-card">
        <div class="invite-title">{{ 'chat.inviteTitle' | transloco:{ name: data().name } }}</div>
        <div class="invite-group">
          <app-user-avatar [type]="UserAvatarType.GROUP" [name]="invite().groupName" [src]="invite().groupAvatar"></app-user-avatar>
          <div class="invite-name">{{ invite().groupName }}</div>
          <span class="invite-chev" aria-hidden="true">›</span>
        </div>
        @if (expiryLabel()) {
          <div class="invite-expiry">{{ 'chat.validUntil' | transloco:{ date: expiryLabel() } }}</div>
        }
      </div>
    </button>
  </div>

  @if (showAvatar() && side() === 'self') {
    <div class="msg-avatar"><app-user-avatar [type]="UserAvatarType.SELF" [name]="data().name" /></div>
  }
</div>
