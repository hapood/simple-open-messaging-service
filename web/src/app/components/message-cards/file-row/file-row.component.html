@if (showDate()) {
  <app-msg-date-row [ms]="data().createdAtMs" />
}

<div
  class="msg-row msg-{{ side() }}{{ showAvatar() ? ' msg-has-avatar' : '' }}{{
    isGroupStart() ? ' msg-group-start' : ''
  }} msg-grp-{{ isShowHead() ? 'head' : 'body' }}"
>
  <span class="msg-highlight-layer" aria-hidden="true"></span>
  @if (showAvatar() && side() === 'other') {
    <div class="msg-avatar">
      <app-avatar [view]="sender.avatar()" />
    </div>
  }

  <div class="msg-col msg-{{ side() }}">
    @if (showName()) {
      <div class="msg-name msg-{{ side() }}">
        {{ sender.name() || ('common.unknown' | transloco) }}
      </div>
    }
    @if (data().quote; as quote) {
      <app-msg-quote-block
        [quote]="quote"
        [isSelf]="data().isSelf"
        (quoteJump)="quoteJump.emit($event)"
      />
    }
    <div class="msg-bubble msg-card msg-{{ side() }} msg-{{ pos() }} msg-file">
      <div
        class="msg-file-row"
        role="button"
        tabindex="0"
        [attr.aria-label]="'chat.openFileAria' | transloco"
        (click)="openFile.emit()"
        (keydown.enter)="openFile.emit()"
        (keydown.space)="$event.preventDefault(); openFile.emit()"
      >
        <span class="msg-file-ico">
          <app-album-media-cell [media]="media()" [compact]="true" />
        </span>
        <span class="msg-file-meta">
          <span class="msg-file-name" [title]="media().name">{{
            media().name
          }}</span>
        </span>
        <span class="msg-file-dl" aria-hidden="true">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
        </span>
      </div>

      <div class="msg-file-footer msg-card-meta msg-{{ side() }}">
        <span class="msg-file-size">{{ sizeText() }}</span>
        <span class="msg-file-time">{{ data().time }}</span>
      </div>
    </div>
  </div>

  @if (showAvatar() && side() === 'self') {
    <div class="msg-avatar">
      <app-avatar [view]="sender.avatar()" />
    </div>
  }
</div>
