<div
  class="pg-msg-row pg-{{ side() }}{{ showAvatar() ? ' pg-has-avatar' : '' }}{{ isGroupStart() ? ' pg-group-start' : '' }} pg-grp-{{ isShowHead() ? 'head' : 'body' }}"
>
  @if (showAvatar() && side() === 'other') {
    <div class="pg-avatar pg-avatar-other">{{ data().name.slice(0, 1) }}</div>
  }

  <div class="pg-col pg-{{ side() }}">
    @if (showName()) {
      <div class="pg-name pg-{{ side() }}">{{ data().name }}</div>
    }
    <div class="pg-bubble pg-{{ side() }} pg-{{ pos() }} pg-media">
      <div class="pg-media-grid" [style.height.px]="totalH()">
        @for (c of cells(); track $index) {
          <div
            class="pg-media-cell{{ c.isMore ? ' pg-cell-more' : '' }}"
            [style.left.%]="c.rect.xPct"
            [style.top.px]="c.rect.yPx"
            [style.width.%]="c.rect.wPct"
            [style.height.px]="c.rect.hPx"
            [style.background-image]="'url(&quot;' + c.src + '&quot;)'"
          >
            @if (c.isMore) {
              <span class="pg-media-more">+{{ moreCount() }}</span>
            }
          </div>
        }
      </div>
      <span class="pg-time pg-{{ side() }}">{{ data().time }}</span>
    </div>
  </div>

  @if (showAvatar() && side() === 'self') {
    <div class="pg-avatar pg-avatar-self">{{ data().name.slice(0, 1) }}</div>
  }
</div>
