@if (dateLabel(); as label) {
  <app-msg-date-row [label]="label" />
}

<div
  class="pg-msg-row pg-{{ side() }}{{ showAvatar() ? ' pg-has-avatar' : '' }}{{ isGroupStart() ? ' pg-group-start' : '' }} pg-grp-{{ isShowHead() ? 'head' : 'body' }}"
>
  @if (showAvatar() && side() === 'other') {
    <div class="pg-avatar"><app-user-avatar [type]="UserAvatarType.OTHER" [name]="data().name" /></div>
  }

  <div class="pg-col pg-{{ side() }}">
    @if (showName()) {
      <div class="pg-name pg-{{ side() }}">{{ data().name }}</div>
    }
    <div class="pg-bubble pg-{{ side() }} pg-{{ pos() }}" [class.pg-sending]="isSending()">
      <p class="pg-bubble-text">
        {{ data().text
        }}<span class="pg-time-shadow" aria-hidden="true">{{ data().time }}</span>
      </p>
      @if (statusTick()) {
        <span class="pg-status pg-status--{{ data().status }}" aria-hidden="true"></span>
      }
      <span class="pg-time pg-{{ side() }}">{{ data().time }}</span>
    </div>
  </div>

  @if (showAvatar() && side() === 'self') {
    <div class="pg-avatar"><app-user-avatar [type]="UserAvatarType.SELF" [name]="data().name" /></div>
  }
</div>
