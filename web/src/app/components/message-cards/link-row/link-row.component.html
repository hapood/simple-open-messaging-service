@if (showDate()) {
  <app-msg-date-row [ms]="data().createdAtMs" />
}

<div
  class="msg-row msg-{{ side() }}{{ showAvatar() ? ' msg-has-avatar' : '' }}{{
    isGroupStart() ? ' msg-group-start' : ''
  }} msg-grp-{{ isShowHead() ? 'head' : 'body' }}"
>
  <span class="msg-highlight-layer" aria-hidden="true"></span>
  @if (showAvatar() && side() === 'other') {
    <div class="msg-avatar">
      <app-avatar [view]="sender.avatar()" />
    </div>
  }

  <div class="msg-col msg-{{ side() }}">
    @if (showName()) {
      <div class="msg-name msg-{{ side() }}">
        {{ sender.name() || ('common.unknown' | transloco) }}
      </div>
    }
    @if (data().quote; as quote) {
      <app-msg-quote-block
        [quote]="quote"
        [isSelf]="data().isSelf"
        (quoteJump)="quoteJump.emit($event)"
      />
    }
    <div class="link-shell">
      <button
        type="button"
        class="msg-bubble msg-card msg-{{ side() }} msg-{{
          pos()
        }} link link-tappable"
        (click)="openUrl()"
      >
        <app-link-card-content [content]="link()" />
      </button>
    </div>
    <div class="link-meta msg-card-meta msg-{{ side() }}">
      <span class="link-host">
        @if (faviconSrc()) {
          <img class="link-favicon" [src]="faviconSrc()" alt="" />
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
            />
            <path
              d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
            />
          </svg>
        }
        <span>{{ source() }}</span>
      </span>
      <span class="link-meta-time">{{ data().time }}</span>
    </div>
  </div>

  @if (showAvatar() && side() === 'self') {
    <div class="msg-avatar">
      <app-avatar [view]="sender.avatar()" />
    </div>
  }
</div>
