<div class="card-wrapper">
  <div>{{data()!.creatorName}} invite you join group:</div>
  <div>{{inviteData().groupName}}</div>
  <div>valid until {{expiryDate()}}</div>
  @switch (status()) {
  @case (0) { <button mat-raised-button (click)="joinGroup()">Join</button>
  }
  @case (1) {
  <button mat-raised-button>EXPIRED</button>
  }
  }
</div>
