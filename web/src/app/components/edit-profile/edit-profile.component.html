<div class="edit-profile" [appFitDialog]="fitOpts">
  <div class="msg-header">
    <button class="icon-btn" (click)="goBack()" [attr.aria-label]="'common.back' | transloco">
      <app-icon [type]="AppIconType.BACK" [style]="{ width: '32px', height: '32px' }"></app-icon>
    </button>
    <span class="title">{{ 'profile.editTitle' | transloco }}</span>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="!canSave()">{{ 'common.save' | transloco }}</button>
  </div>

  <div class="body">
    <div class="avatar-wrap">
      <div class="avatar">
        <app-user-avatar [type]="UserAvatarType.SELF"
          [name]="name() || sessionProfile()?.uniqName || 'SOMS'"
          [src]="sessionProfile()?.avatar" />
        <button class="avatar-edit" type="button" (click)="fileInput.click()"
          [disabled]="uploading()" [attr.aria-label]="'profile.changeAvatarAria' | transloco">
          @if (uploading()) {
            <span class="spin"></span>
          } @else {
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
          }
        </button>
      </div>
      <input #fileInput type="file" accept="image/*" hidden (change)="onAvatarPicked($event)" />
    </div>

    <label class="field">
      <span class="label">{{ 'profile.name' | transloco }}</span>
      <input class="text" [ngModel]="name()" (ngModelChange)="name.set($event)"
        maxlength="30" [placeholder]="'profile.namePlaceholder' | transloco" />
      @if (nameHint()) {
        <span class="hint">{{ nameHint() }}</span>
      }
    </label>

    <label class="field">
      <span class="label">{{ 'profile.bio' | transloco }}</span>
      <textarea class="textarea" rows="3" [ngModel]="bio()" (ngModelChange)="bio.set($event)"
        maxlength="120" [placeholder]="'profile.bioPlaceholder' | transloco"></textarea>
      <span class="counter">{{ bio().length }}/120</span>
    </label>

    <div class="handle">{{ 'profile.usernameHandle' | transloco:{ name: sessionProfile()?.uniqName } }}</div>
    <div class="account-actions">
      <button type="button" class="account-btn" (click)="openSessions()"
        [attr.aria-label]="'profile.manageSessions' | transloco">
        {{ 'profile.manageSessions' | transloco }}
      </button>
      <button type="button" class="account-btn danger" (click)="logout()"
        [attr.aria-label]="'nav.logout' | transloco">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <path d="M16 17l5-5-5-5" />
          <path d="M21 12H9" />
        </svg>
        <span>{{ 'nav.logout' | transloco }}</span>
      </button>
    </div>
  </div>
</div>
