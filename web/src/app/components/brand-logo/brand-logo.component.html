<div class="brand-logo">
  <svg class="bl-mark" [style.width.px]="size()" [style.height.px]="size()"
    viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SOMS logo">
    <rect width="64" height="64" rx="14" fill="#2196f3" />
    <path transform="translate(6 7) scale(2.2)" fill="#ffffff"
      d="M12 3C6.5 3 2 6.6 2 11c0 2.3 1.2 4.4 3.2 5.8-.2 1-.7 2.2-1.6 3.2-.2.2 0 .6.3.5 1.7-.3 3.2-1 4.4-1.9 1.1.3 2.3.4 3.7.4 5.5 0 10-3.6 10-8s-4.5-8-10-8z" />
  </svg>
  @if (wordmark()) {
    <div class="bl-word">SOMS</div>
  }
  @if (tagline()) {
    <div class="bl-tag">{{ tagline() }}</div>
  }
</div>
