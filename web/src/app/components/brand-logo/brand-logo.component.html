<div class="brand-logo">
  <!-- The mark is the single shared source: web/public/logo.svg (same file the
       favicon / PWA / Tauri icons are generated from). Referenced by RELATIVE path
       so it resolves against <base href>: root-hosted builds (base "/") behave as
       before, while sub-path deploys such as GitHub Pages resolve under the
       deploy prefix instead of the domain root. -->
  <img
    class="bl-mark"
    src="logo.svg"
    [style.width.px]="size()"
    [style.height.px]="size()"
    alt="SOMS logo"
  />
  @if (wordmark()) {
    <div class="bl-word">SOMS</div>
  }
  @if (tagline()) {
    <div class="bl-tag">{{ tagline() }}</div>
  }
</div>
