<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Static theme-color fallback. The FOUC script just below (and ThemeService at runtime)
       updates this to match the resolved theme, so the browser chrome blends from the very first
       frame — placed before the script so the script can find it via querySelector. -->
  <meta name="theme-color" content="#2196f3">
  <!-- Apply the persisted/system theme before first paint to avoid a flash of the
       wrong theme (FOUC). Mirrors ThemeService's resolution exactly; the service
       re-asserts and owns runtime changes after Angular boots. Also writes the matching
       theme-color so mobile browser chrome (and the PWA splash) never flashes the wrong hue. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('soms.theme');
        var mode = (stored === 'light' || stored === 'dark') ? stored : 'system';
        var dark = mode === 'dark' ||
          (mode === 'system' && window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0b141a' : '#2196f3');
      } catch (e) { /* localStorage disabled — ThemeService applies the default */ }
    })();
  </script>
  <!-- Set <html lang> before first paint so the very first frame has the correct
       language attribute (screen readers / a11y). Mirrors LanguageService's
       resolution; the service re-asserts and owns runtime changes after boot. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('soms.lang');
        var lang = (stored === 'en' || stored === 'zh-CN')
          ? stored
          : (navigator.language && navigator.language.toLowerCase().indexOf('zh') === 0 ? 'zh-CN' : 'en');
        document.documentElement.setAttribute('lang', lang);
      } catch (e) { /* localStorage disabled — LanguageService applies the default */ }
    })();
  </script>
  <title>SOMS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- iOS home-screen icon (180×180, solid brand bg — iOS flattens transparency to black otherwise). -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="SOMS">
</head>
<body>
  <!-- App-shell spinner: shows the instant the page parses (before Angular boots), so a freshly-created
       / reloading main window (the two-window handoff in src-tauri) never flashes a blank frame. Angular
       replaces <app-root>'s content on boot, then AppComponent emits `spa-ready` (Rust gates the window
       show on it). Styles live in styles.scss (global). Harmless in the browser/PWA build (replaced fast). -->
  <app-root>
    <div class="app-splash">
      <div class="app-splash__spinner"></div>
      <div class="app-splash__word">SOMS</div>
    </div>
  </app-root>
</body>
</html>
