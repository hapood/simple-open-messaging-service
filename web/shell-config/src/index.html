<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#2196f3">
  <!-- FOUC theme: apply the persisted/system theme before first paint so the bootstrap never flashes the
       wrong one. Mirrors the main app's web/src/index.html script (data-theme=dark). -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('soms.theme');
        var mode = (stored === 'light' || stored === 'dark') ? stored : 'system';
        var dark = mode === 'dark' ||
          (mode === 'system' && window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0b141a' : '#2196f3');
      } catch (e) { /* ThemeService absent in the bootstrap — default light applies. */ }
    })();
  </script>
  <title>SOMS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
  <!-- App-shell spinner: shows the instant the page parses (before Angular boots), so a freshly-created
       / reloading init window never shows a blank frame. Angular replaces <app-root>'s content on boot,
       then emits init-ready (Rust gates the window show on it). Styles live in styles.scss (global). -->
  <app-root>
    <div class="sc-splash">
      <div class="sc-splash__spinner"></div>
      <div class="sc-splash__word">SOMS</div>
    </div>
  </app-root>
</body>
</html>
