[package]
name = "soms-native-session-contracts"
version = "0.0.0"
edition = "2021"
publish = false

# Exercise the production transport without requiring a WebView/GTK build or a running app.
[workspace]

[lib]
path = "../../src/native_logout.rs"
doctest = false

[dependencies]
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "net", "io-util"] }
uuid = { version = "1", features = ["v4"] }
