"$schema" = "schemas/schema.json"

# App-defined IPC commands registered via generate_handler! in src/lib.rs. This file is the AUTHORITATIVE
# command list for the ACL: each command needs a [[permission]] entry here, and the [default] aggregate is
# what the `default` capability (capabilities/default.json) grants to the SPA's webview. tauri-build
# regenerates gen/schemas from THIS file (permissions/ is a rerun-if-changed input) — NOT by parsing
# lib.rs — so the ACL tracks this file, not generate_handler!.
#
# KEEP IN SYNC with generate_handler!: a command missing here is rejected at runtime
# ("<cmd> not allowed. Command not found"), and a command removed from lib.rs but left here is a dead
# permission. (This is why a newly-added command seemed "un-addable" — the file wasn't updated.)

[[permission]]
identifier = "allow-set-api-origin"
description = "Enables the set_api_origin command (validate + persist the backend origin)."
commands.allow = ["set_api_origin"]

[[permission]]
identifier = "allow-get-api-origin"
description = "Enables get_api_origin — the configured backend origin (live ProxyState Arc)."
commands.allow = ["get_api_origin"]

[[permission]]
identifier = "allow-get-active-api-origin"
description = "Enables get_active_api_origin — the exact runtime endpoint currently used by Rust HTTP transports."
commands.allow = ["get_active_api_origin"]

[[permission]]
identifier = "allow-is-origin-configured"
description = "Enables is_origin_configured — authoritative 'has a backend been configured' (origin != the non-routable placeholder)."
commands.allow = ["is_origin_configured"]

# Native LAN-domain fallback (field-2 origin + the active-mode indicator). All three are no-ops when no
# secondary is configured (dev / servers without SOMS_LAN_DOMAIN) — the shell behaves exactly as before.
[[permission]]
identifier = "allow-get-api-origin-secondary"
description = "Enables get_api_origin_secondary — the configured LAN origin (null when no fallback is configured)."
commands.allow = ["get_api_origin_secondary"]

[[permission]]
identifier = "allow-set-api-origin-secondary"
description = "Enables set_api_origin_secondary — validate + persist the LAN origin (empty clears it, disabling fallback)."
commands.allow = ["set_api_origin_secondary"]

[[permission]]
identifier = "allow-get-origin-mode"
description = "Enables get_origin_mode — which origin is ACTIVE (primary | secondary), for the 'using LAN server' indicator."
commands.allow = ["get_origin_mode"]

[[permission]]
identifier = "allow-init-pick-origin"
description = "Enables init_pick_origin — the login-init concurrent race (probe both /health, pick reachable, set active)."
commands.allow = ["init_pick_origin"]

[[permission]]
identifier = "allow-set-active-origin"
description = "Enables set_active_origin — Android passive-accept (Kotlin signals the active origin; Rust sets it without deciding)."
commands.allow = ["set_active_origin"]

[[permission]]
identifier = "allow-set-session-token"
description = "Enables the set_session_token command (bearer for the media:// proxy)."
commands.allow = ["set_session_token"]

[[permission]]
identifier = "allow-clear-session-token"
description = "Enables the clear_session_token command."
commands.allow = ["clear_session_token"]

[[permission]]
identifier = "allow-get-shell-version"
description = "Enables get_shell_version (CARGO_PKG_VERSION) for the compat check + About display."
commands.allow = ["get_shell_version"]

[[permission]]
identifier = "allow-init-check-compat"
description = "Enables init_check_compat — shell↔server version compatibility probe (GET /shell/compat)."
commands.allow = ["init_check_compat"]

[[permission]]
identifier = "allow-init-validate-cert"
description = "Enables init_validate_cert — strict TLS probe for https domains (skipped for IP/http)."
commands.allow = ["init_validate_cert"]

[[permission]]
identifier = "allow-init-download-web"
description = "Enables init_download_web — manifest → download → sha256 verify → atomic install (OTA bundle swap)."
commands.allow = ["init_download_web"]

[[permission]]
identifier = "allow-init-update-status"
description = "Enables init_update_status — on-launch / on-demand probe of the server manifest vs the installed web hash."
commands.allow = ["init_update_status"]

# Trusted-device secure storage (desktop keyring): persist/read/clear a TRUSTED desktop's permanent
# session token in the OS credential store instead of plaintext localStorage.
[[permission]]
identifier = "allow-secure-set-token"
description = "Enables the secure_set_token command (OS credential store)."
commands.allow = ["secure_set_token"]

[[permission]]
identifier = "allow-secure-get-token"
description = "Enables the secure_get_token command (OS credential store)."
commands.allow = ["secure_get_token"]

[[permission]]
identifier = "allow-secure-clear-token"
description = "Enables the secure_clear_token command (OS credential store)."
commands.allow = ["secure_clear_token"]

# Desktop SSE supervisor (Rust-owned /events stream). Desktop-only (Android owns SSE in Kotlin); these
# commands are #[cfg(desktop)] in lib.rs, so the entries are inert on a mobile build.
[[permission]]
identifier = "allow-sse-start"
description = "Enables sse_start — idempotently spawn the desktop SSE supervisor connect-loop."
commands.allow = ["sse_start"]

[[permission]]
identifier = "allow-sse-stop"
description = "Enables sse_stop — cancel the desktop SSE supervisor and emit closed."
commands.allow = ["sse_stop"]

[[permission]]
identifier = "allow-sse-get-state"
description = "Enables sse_get_state — synchronous read of the SSE connection state (renderer-reclaim seed)."
commands.allow = ["sse_get_state"]

[[permission]]
identifier = "allow-sse-net"
description = "Enables sse_net — forward navigator online/offline (+ user retry) to the supervisor."
commands.allow = ["sse_net"]

[[permission]]
identifier = "allow-sse-replay-hello"
description = "Enables sse_replay_hello — replay the cached+merged HELLO to a freshly-attached webview (renderer reclaim / FGS-pre-connected cold start) so it bootstraps (userId/threadRevision/profileRev/friendReqRev/latestMessage) without a reconnect."
commands.allow = ["sse_replay_hello"]

[[permission]]
identifier = "allow-upload-stream-file"
description = "Enables upload_stream_file — desktop streaming multipart upload from an on-disk file path (avoids buffering the whole file through the webview/IPC)."
commands.allow = ["upload_stream_file"]

[[permission]]
identifier = "allow-cancel-upload"
description = "Enables cancel_upload — idempotently cancel one desktop streaming upload by its client message ID."
commands.allow = ["cancel_upload"]

[[permission]]
identifier = "allow-report-diagnostics"
description = "Enables report_diagnostics — build a gzip-tar diagnostic bundle (Rust logs + webview console capture + manifest) and upload it to the backend for field support; on failure it is cached under app_cache_dir for next-launch retry."
commands.allow = ["report_diagnostics"]

[[permission]]
identifier = "allow-read-native-log"
description = "Enables read_native_log — tail the active Rust log or the Kotlin native.log BY NAME (never a caller-supplied path) for the debug log panel. Source-attributed + filterable read-only view; not a generic file-read."
commands.allow = ["read_native_log"]

[[permission]]
identifier = "allow-api-request"
description = "Enables api_request — the webview→backend HTTP transport under Tauri. An IPC fetch that performs the reqwest call on the Rust side and injects the Bearer from ProxyState.token (JS never touches the token); replaces the api:// custom-scheme proxy that Android WebView could not fetch."
commands.allow = ["api_request"]

[[permission]]
identifier = "allow-media-request"
description = "Enables media_request — the webview→backend MEDIA transport under Tauri. The avatar blob cache does http.get(media://...) which Android WebView cannot fetch (custom-scheme fetch rejected); this command performs the reqwest GET to /uploads/* on the Rust side with the Bearer from ProxyState.token and returns the raw bytes."
commands.allow = ["media_request"]

[[permission]]
identifier = "allow-media-download"
description = "Enables the task-scoped native media download commands (stream into the shared cache, report progress, and cancel)."
commands.allow = [
  "cache_media",
  "download_media",
  "cancel_media_download",
  "clear_media_cache",
  "get_media_cache_info",
  "set_media_cache_limit",
  "save_media_desktop",
]

[[permission]]
identifier = "allow-open-external-url"
description = "Enables open_external_url — open a LINK message card's target URL in the system browser (the webview's nav guard blocks in-app external navigation)."
commands.allow = ["open_external_url"]

[[permission]]
identifier = "allow-native-db"
description = "Enables the typed native SQLite cache commands used by the bundled SPA."
commands.allow = [
  "native_db_threads",
  "native_db_put_thread",
  "native_db_replace_threads",
  "native_db_delete_thread",
  "native_db_apply_thread_delta",
  "native_db_get_profile",
  "native_db_put_profile",
  "native_db_get_meta",
  "native_db_put_meta",
  "native_db_clear_user",
  "native_db_clear_all",
  "native_db_get_avatar",
  "native_db_put_avatar",
  "native_db_query_messages",
  "native_db_put_messages",
  "native_db_get_message",
  "native_db_newest_messages",
  "native_db_delete_messages_by_thread",
]

[default]
description = "All app-defined IPC commands: origin get/set/is-configured + session token + secure (keyring) token + shell dynamic-update (init_*) + desktop SSE supervisor (sse_*)."
permissions = [
  "allow-set-api-origin",
  "allow-get-api-origin",
  "allow-get-active-api-origin",
  "allow-is-origin-configured",
  "allow-get-api-origin-secondary",
  "allow-set-api-origin-secondary",
  "allow-get-origin-mode",
  "allow-init-pick-origin",
  "allow-set-active-origin",
  "allow-set-session-token",
  "allow-clear-session-token",
  "allow-secure-set-token",
  "allow-secure-get-token",
  "allow-secure-clear-token",
  "allow-get-shell-version",
  "allow-init-check-compat",
  "allow-init-validate-cert",
  "allow-init-download-web",
  "allow-init-update-status",
  "allow-sse-start",
  "allow-sse-stop",
  "allow-sse-get-state",
  "allow-sse-net",
  "allow-sse-replay-hello",
  "allow-upload-stream-file",
  "allow-cancel-upload",
  "allow-report-diagnostics",
  "allow-read-native-log",
  "allow-api-request",
  "allow-media-request",
  "allow-media-download",
  "allow-open-external-url",
  "allow-native-db",
]
