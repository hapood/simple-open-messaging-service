[package]
name = "soms-client"
version = "0.1.0"
description = "SOMS cross-platform client (Tauri v2 shell around the Angular consumer client)"
authors = ["hapood"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` suffix makes the crate name `soms_client_lib`; the main binary calls `soms_client_lib::run()`.
name = "soms_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Desktop system notifications (the UnreadAttentionService foreground "new message while unfocused"
# popup on Tauri desktop — the webview's Notification API is unreliable in desktop shells, so the
# plugin is the documented path). Not used on Android (FCM/WorkManager cover it there).
tauri-plugin-notification = "2"
# Native HTTP for the WebView: the bundled app's webview origin (https://tauri.localhost) is
# cross-origin to every user-configured backend, so the WebView's own fetch() is CORS-gated and a
# backend that doesn't echo that Origin is unreachable — the exact opposite of dev, where the ng
# dev-server proxy keeps every request same-origin. installNativeFetch() (web/.../runtime.ts) swaps
# the webview's fetch for the plugin's reqwest-backed fetch under the Tauri shell, so requests leave
# the webview and CORS never applies (the same reason /uploads rides the media:// proxy). Mobile +
# desktop: reqwest under the hood on every target.
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls-tls so we don't pull openssl-sys (avoids a system libssl build dependency on the build host).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
# Web-bundle integrity for the dynamic-update flow: the shell downloads the main SPA from the
# user-configured server and Ed25519-verifies it against a pinned pubkey before extracting/executing
# a byte (RCE guard; for IP/http origins the signature is the only integrity guarantee). Pure-Rust
# ed25519-dalek preserves the "no openssl-sys" invariant; sha2 = the bundle SHA-256 the manifest
# advertises; flate2 + tar extract the gzip tarball; base64 decodes the signature + the env pubkey.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
base64 = "0.22"
flate2 = "1"
tar = "0.4"

# Desktop-only deps. tauri-plugin-single-instance has no mobile backend (a phone has no concept of
# "another instance"), so it is gated to non-mobile targets to keep the Android build compiling.
# `keyring` is the OS-native credential store (Windows DPAPI via Credential Manager / macOS Keychain /
# Linux libsecret via the Secret Service) used to persist a TRUSTED desktop's session token AT REST —
# instead of the plaintext webview localStorage copy — so a trusted desktop may hold a permanent token.
# Backends are enabled per OS; Android is excluded (it uses its own EncryptedSharedPreferences bridge).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Mobile-only dep. tauri-plugin-barcode-scanner is the camera scanner for the phone side of QR sign-in — a
# logged-in phone scans a desktop's QR to authorize it (two-step scan→confirm). It has no desktop backend, so
# it is gated to mobile targets (the inverse of single-instance above) and registered in src/lib.rs under
# #[cfg(mobile)]. The JS API is @tauri-apps/plugin-barcode-scanner; capability in capabilities/mobile.json.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# Lean release binary + lower runtime RSS for BOTH desktop and Android release builds — Cargo applies
# [profile.release] regardless of target, so the NDK cross-build inherits it too. codegen-units = 1 +
# LTO let the optimizer see the whole program (smaller binary, fewer redundant copies in the text/heap);
# opt-level = "s" optimizes for size; strip drops debug symbols; panic = "abort" drops the unwind
# tables (binary AND resident memory both shrink).
#
# lto = "thin" (NOT fat `true`): Tauri's dependency graph is huge, and fat LTO during Android NDK
# linking eats several GB of RAM and readily OOMs the cross-toolchain. Thin LTO keeps nearly all the
# size/binary win at a fraction of the memory+time, so the same profile is safe on both targets.
# Dev builds are untouched so iteration stays fast.
[profile.release]
lto = "thin"
opt-level = "s"
strip = true
panic = "abort"
codegen-units = 1

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
