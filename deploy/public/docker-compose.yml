# SOMS public deployment. Runtime configuration lives in the adjacent .env file.
# Start with the standard command: docker compose up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${PGDATABASE:-soms}
      POSTGRES_USER: ${PGUSER:-timescale}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${PGUSER:-timescale} -d ${PGDATABASE:-soms}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: soms:latest
    env_file: ${SOMS_ENV_FILE:-.env}
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-soms}
      PGUSER: ${PGUSER:-timescale}
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['node', 'dist/scripts/migrate-db.js', 'migrate']
    restart: 'no'

  app:
    image: soms:latest
    env_file: ${SOMS_ENV_FILE:-.env}
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-soms}
      PGUSER: ${PGUSER:-timescale}
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
      # Caddy and the API share this container; make that proxy boundary explicit.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.0/8,::1/128}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 60s
    volumes:
      # Keep all SOMS-generated state and the two operator-provided Firebase files in
      # <deployment-directory>/data so the deployment can be backed up as one directory.
      - ./data:/app/data
    ports:
      - target: 80
        published: ${SOMS_HTTP_PORT:-80}
        protocol: tcp
      - target: 443
        published: ${SOMS_HTTPS_PORT:-443}
        protocol: tcp
      - target: 443
        published: ${SOMS_HTTPS_PORT:-443}
        protocol: udp
      - target: 7667
        published: ${SOMS_FEDERATION_PORT:-7667}
        protocol: tcp
      - target: 7667
        published: ${SOMS_FEDERATION_PORT:-7667}
        protocol: udp
    restart: unless-stopped

volumes:
  postgres-data:
