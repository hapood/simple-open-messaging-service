name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v0.1.0-alpha.1'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve and validate release tag
        id: resolve
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          COMMIT=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/main
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify release version
        run: |
          node scripts/check-version-sync.mjs
          VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$VERSION"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Android NDK
        run: sdkmanager 'ndk;27.1.12297006'
      - name: Install frontend and Tauri tooling
        run: |
          npm ci --prefix web
          cargo install tauri-cli --version 2.11.4 --locked
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/app/soms-release.keystore
          {
            echo 'storeFile=app/soms-release.keystore'
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
      - name: Build signed per-ABI release APKs
        run: |
          make -C src-tauri apk ABI=aarch64
          make -C src-tauri apk ABI=armv7 WEB_BUILD=0
          make -C src-tauri apk ABI=x86_64 WEB_BUILD=0
          cd src-tauri/dist/android
          sha256sum *.apk > SHA256SUMS
      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soms-android-release
          path: |
            src-tauri/dist/android/*.apk
            src-tauri/dist/android/SHA256SUMS
          if-no-files-found: error
  publish:
    needs: [prepare, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: soms-android-release
          path: release-assets
      - name: Extract release notes from changelog
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const sections = [...changelog.matchAll(/^## (.+)\r?$/gm)];
          const index = sections.findIndex((section) => section[1] === version);
          if (index === -1) {
            throw new Error(`Missing changelog entry for ${version}`);
          }
          const section = sections[index];
          const notes = changelog.slice(
            section.index + section[0].length,
            sections[index + 1]?.index ?? changelog.length,
          ).trim();
          if (!notes) {
            throw new Error(`Empty changelog entry for ${version}`);
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'release-notes.md'), `${notes}\n`);
          NODE
      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$RELEASE_TAG" release-assets/*.apk release-assets/SHA256SUMS --clobber
          else
            RELEASE_FLAGS=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              RELEASE_FLAGS+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" release-assets/*.apk release-assets/SHA256SUMS --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" "${RELEASE_FLAGS[@]}"
          fi
