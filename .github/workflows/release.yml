name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v0.1.0-alpha.1'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve and validate release tag
        id: resolve
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          COMMIT=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/main
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify release version
        run: |
          node scripts/check-version-sync.mjs
          VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$VERSION"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Android NDK
        run: sdkmanager 'ndk;27.1.12297006'
      - name: Install frontend and Tauri tooling
        run: |
          npm ci --prefix web
          cargo install tauri-cli --version 2.11.4 --locked
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/app/soms-release.keystore
          {
            echo 'storeFile=app/soms-release.keystore'
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
      - name: Build signed per-ABI release APKs
        run: |
          make -C src-tauri apk ABI=aarch64
          make -C src-tauri apk ABI=armv7 WEB_BUILD=0
          make -C src-tauri apk ABI=x86_64 WEB_BUILD=0
          cd src-tauri/dist/android
          sha256sum *.apk > SHA256SUMS
      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soms-android-release
          path: |
            src-tauri/dist/android/*.apk
            src-tauri/dist/android/SHA256SUMS
          if-no-files-found: error
  linux:
    needs: prepare
    # Pinned to 22.04 — NOT ubuntu-latest: the bundles link against the runner's glibc (2.35) and
    # WebKitGTK 4.1, which is the oldest supported baseline. A 24.04 build (glibc 2.39) refuses to
    # start on 22.04-era hosts.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify release version
        run: |
          node scripts/check-version-sync.mjs
          VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$VERSION"
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend and Tauri tooling
        run: |
          npm ci --prefix web
          cargo install tauri-cli --version 2.11.4 --locked
      - name: Build AppImage and deb bundles
        run: make -C src-tauri linux
      - name: Checksum Linux artifacts
        run: |
          cd src-tauri/dist/linux
          sha256sum SOMS-* > SHA256SUMS.linux
      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soms-linux-release
          path: |
            src-tauri/dist/linux/SOMS-*
            src-tauri/dist/linux/SHA256SUMS.linux
          if-no-files-found: error
  macos:
    needs: prepare
    # Ad-hoc signed by default (the committed signingIdentity "-") — identical to a local
    # personal build. For signed + notarized public distribution, configure the APPLE_* repo
    # secrets; the build step passes them through to Tauri verbatim (empties are unset so the
    # ad-hoc fallback keeps working when secrets are absent).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify release version
        run: |
          node scripts/check-version-sync.mjs
          VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$VERSION"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend and Tauri tooling
        run: |
          npm ci --prefix web
          cargo install tauri-cli --version 2.11.4 --locked
      - name: Build universal macOS bundles
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An unset secret arrives as an EMPTY string, and an empty APPLE_SIGNING_IDENTITY would
          # override the committed ad-hoc identity and fail codesign — drop empties first.
          for v in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          make -C src-tauri macos
      - name: Checksum macOS artifacts
        run: |
          cd src-tauri/dist/macos
          shasum -a 256 SOMS-*.dmg > SHA256SUMS.macos
      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soms-macos-release
          path: |
            src-tauri/dist/macos/SOMS-*.dmg
            src-tauri/dist/macos/SHA256SUMS.macos
          if-no-files-found: error
  publish:
    needs: [prepare, android, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: soms-android-release
          path: release-assets
      - name: Download Linux release artifacts
        uses: actions/download-artifact@v4
        with:
          name: soms-linux-release
          path: release-assets/linux
      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          name: soms-macos-release
          path: release-assets/macos
      - name: Extract release notes from changelog
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const sections = [...changelog.matchAll(/^## (.+)\r?$/gm)];
          const index = sections.findIndex((section) => section[1] === version);
          if (index === -1) {
            throw new Error(`Missing changelog entry for ${version}`);
          }
          const section = sections[index];
          const notes = changelog.slice(
            section.index + section[0].length,
            sections[index + 1]?.index ?? changelog.length,
          ).trim();
          if (!notes) {
            throw new Error(`Empty changelog entry for ${version}`);
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'release-notes.md'), `${notes}\n`);
          NODE
      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$RELEASE_TAG" \
              release-assets/*.apk release-assets/SHA256SUMS \
              release-assets/linux/SOMS-*.AppImage release-assets/linux/SOMS-*.deb \
              release-assets/linux/SHA256SUMS.linux \
              release-assets/macos/SOMS-*.dmg release-assets/macos/SHA256SUMS.macos --clobber
          else
            RELEASE_FLAGS=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              RELEASE_FLAGS+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" \
              release-assets/*.apk release-assets/SHA256SUMS \
              release-assets/linux/SOMS-*.AppImage release-assets/linux/SOMS-*.deb \
              release-assets/linux/SHA256SUMS.linux \
              release-assets/macos/SOMS-*.dmg release-assets/macos/SHA256SUMS.macos \
              --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" "${RELEASE_FLAGS[@]}"
          fi
