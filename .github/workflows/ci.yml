name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build SOMS image
        uses: docker/bake-action@v7
        with:
          source: .
          targets: app
          set: |
            app.tags=soms:ci
            app.output=type=docker
            runtime-base.cache-from=type=gha,scope=soms-runtime-base
            runtime-base.cache-to=type=gha,mode=max,scope=soms-runtime-base
            build-base.cache-from=type=gha,scope=soms-build-base
            build-base.cache-to=type=gha,mode=max,scope=soms-build-base
            app.cache-from=type=gha,scope=soms-app
            app.cache-to=type=gha,mode=max,scope=soms-app
      - name: Inspect image
        run: |
          docker image inspect soms:ci
          docker run --rm --entrypoint ffprobe soms:ci -version
          docker run --rm --entrypoint caddy soms:ci version

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Android NDK
        run: sdkmanager 'ndk;27.1.12297006'
      - name: Install frontend and Tauri tooling
        run: |
          npm ci --prefix web
          cargo install tauri-cli --version 2.12.4 --locked
      - name: Build arm64 debug APK
        run: make -C src-tauri apk-debug ABI=aarch64
      - name: Run Android JVM tests
        working-directory: src-tauri/gen/android
        run: ./gradlew :app:testUniversalDebugUnitTest --no-daemon
      - name: Upload Android JVM test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-failures
          path: src-tauri/gen/android/app/build/reports/tests/
          if-no-files-found: ignore

  linux:
    # Same pinned runner as the release workflow's Linux job: the bundles link against the
    # runner's glibc + WebKitGTK, and 22.04 is the oldest supported baseline. Validates the
    # Linux-only cfg paths (notify-rust/zbus notifications, keyring) plus the AppImage/deb
    # bundling on every push/PR instead of only at release time.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend and Tauri tooling
        run: |
          npm ci --prefix web
          cargo install tauri-cli --version 2.12.4 --locked
      - name: Build Linux desktop bundles
        run: make -C src-tauri linux
      - name: Test shared Rust runtime on Linux
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

  macos:
    # Validates the macOS-only cfg paths (macos_notifications.m, Dock badge) and the universal
    # .app/.dmg bundling. Ad-hoc signed (the committed signingIdentity "-") — no Apple cert.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend and Tauri tooling
        run: |
          npm ci --prefix web
          cargo install tauri-cli --version 2.12.4 --locked
      - name: Build universal macOS bundles
        run: make -C src-tauri macos
      - name: Test shared Rust runtime on macOS
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
