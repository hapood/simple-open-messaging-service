# Self-contained SOMS stack: postgres + one-shot migrate + app + Caddy (TLS edge).
#
# compose only RUNS images — it does NOT build the app image. Build it first, out-of-band:
#   ./scripts/build-image.sh        # release flow: soms:<package version> + soms:latest
#   docker build -t soms:dev .      # or, for local dev
# then set APP_VERSION to the tag you built (default: dev). With no `build:` block on the app
# service, `up` fails fast if the image is missing instead of silently running a long multi-stage
# build. The caddy image, by contrast, IS built by compose (a local xcaddy artifact with no
# registry build path — see Dockerfile.caddy).
#
# Launches directly from environment variables — NO .env file required:
#
#   POSTGRES_PASSWORD=secret SOMS_DOMAIN=chat.example.com \
#   CLOUDFLARE_API_TOKEN=... docker compose up -d
#
# Only ONE port is published: 7667 (HTTPS) — web UI + API + SSE + federation S2S all ride on it.
# Caddy terminates TLS (auto-issued + auto-renewed via Let's Encrypt DNS-01 through Cloudflare, so
# no ports 80/443 are needed) and reverse-proxies to the app over plain HTTP/1.1.
#
# Required (must be present in the shell environment — compose fails fast otherwise):
#   POSTGRES_PASSWORD       PostgreSQL superuser password (DB container + the app's DATABASE_URL)
#   SOMS_DOMAIN             this server's public domain, the federation identity (@user@<SOMS_DOMAIN>)
#   CLOUDFLARE_API_TOKEN    Cloudflare API token with Zone:DNS:Edit on the SOMS_DOMAIN zone
#
# Optional (safe defaults / auto-generated, omit unless you need to override):
#   APP_VERSION             image tag (default: dev)
#   DATABASE_POOL_MAX       Prisma/node-pg pool size (default: 10)
#   JWT_*_SECRET            unset → auto-generated on first boot into /app/data/jwt-*.key (mode 0600)
#
# The DNS provider is Cloudflare by example. To use another, edit BOTH Dockerfile.caddy (the xcaddy
# --with plugin import) and Caddyfile (the `dns` line + env var), and set the matching credential
# env on the caddy service below. The app stays plain HTTP/1.1 — do NOT set TLS_CERT/TLS_KEY
# (Caddy is the TLS edge; the app was designed for this topology, see src/main.ts).
#
# Optional features (Web Push VAPID_*, FCM GOOGLE_APPLICATION_CREDENTIALS, LOG_*) are intentionally
# not wired here — supply them through a compose override file
# (`docker compose -f docker-compose.yml -f override.yml up -d`) so this file stays a minimal base.
#
# First deploy only — seed the bootstrap admin:
#   docker compose run -e ADMIN_BOOTSTRAP_PASSWORD=... --rm app node prisma/seed-admin.cjs

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: soms
      POSTGRES_USER: timescale
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timescale -d soms"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot migration runner. Reuses the app image (prisma CLI + migrations + config already baked
  # in), applies pending migrations idempotently, then exits 0. Runs on every `up` but is a sub-second
  # no-op when nothing is pending — `prisma migrate deploy` is idempotent via the _prisma_migrations
  # table, and the existing manual `migrate resolve --applied` history keeps that table in sync.
  migrate:
    image: soms:${APP_VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://timescale:${POSTGRES_PASSWORD:?}@postgres:5432/soms?schema=public
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"

  app:
    # compose only RUNS this image — it is NOT built here. Build it out-of-band first
    # (./scripts/build-image.sh for a release tag, or `docker build -t soms:dev .` for local dev),
    # then set APP_VERSION to the tag you built. No `build:` block means `up` fails fast if the image
    # is missing instead of silently kicking off a long multi-stage build.
    image: soms:${APP_VERSION:-dev}
    # The app does NOT start until postgres is healthy AND migrate has exited 0 — a failed migration
    # keeps the app down with a visible error rather than booting half-schema.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Compose computes DATABASE_URL: the DB host is the `postgres` service name, not localhost.
      DATABASE_URL: postgresql://timescale:${POSTGRES_PASSWORD:?}@postgres:5432/soms?schema=public
      SOMS_DOMAIN: ${SOMS_DOMAIN:?set SOMS_DOMAIN in the environment}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      APP_VERSION: ${APP_VERSION:-dev}
    volumes:
      - app-uploads:/app/uploads
      - app-data:/app/data     # S2S Ed25519 keypair + auto-generated JWT signing keys (./data/jwt-*.key)
      - app-logs:/app/logs
    # Port 3000 is NOT published — Caddy (service below) is the only public entry, on 7667. The app
    # stays plain HTTP/1.1: do NOT set TLS_CERT/TLS_KEY here; Caddy terminates TLS at the edge and
    # the origin leg is h1.1, the mode the app was designed for (see src/main.ts). Re-add a temporary
    # `ports: ["3000:3000"]` only for local debugging, never in production.
    restart: unless-stopped

  # Caddy TLS edge. Builds the custom image (Dockerfile.caddy = xcaddy + Cloudflare DNS-01 plugin),
  # publishes a single port 7667, and reverse-proxies to app:3000. Certs are issued/renewed via
  # DNS-01 so no ports 80/443 are exposed. See Caddyfile for the routing + provider swap notes.
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
      args:
        # Go module proxy for xcaddy. Override for restricted networks — e.g. set
        # GOPROXY=https://goproxy.cn,direct in the environment (or .env) for China.
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: soms-caddy:${APP_VERSION:-dev}
    depends_on:
      app:
        condition: service_started
    environment:
      SOMS_DOMAIN: ${SOMS_DOMAIN:?set SOMS_DOMAIN in the environment}
      # Cloudflare API token with Zone:DNS:Edit on the SOMS_DOMAIN zone. Swap this env (and the
      # `dns` line in Caddyfile + the plugin in Dockerfile.caddy) to use another DNS provider.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN (Cloudflare Zone:DNS:Edit token)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # ACME account + issued certs — MUST persist (avoids re-issue rate limits)
      - caddy_config:/config   # Caddy autosave config
    ports:
      - "7667:7667"      # HTTPS — web UI + API + SSE + federation S2S, the only public port
      - "7667:7667/udp"  # HTTP/3 (QUIC); drop this line if you don't want h3
    restart: unless-stopped

volumes:
  pgdata:
  app-uploads:
  app-data:
  app-logs:
  caddy_data:
  caddy_config:
