# SOMS all-in-one stack: postgres + one-shot migrate + app (the full image bundles the app + Caddy TLS
# edge behind a single published port, 7667).
#
# Quick start — edit the REQUIRED values in the DEPLOYMENT CONFIG block just below, then:
#   docker compose up -d
# First-run Let's Encrypt DNS-01 cert issuance takes 10–60s — watch for "certificate obtained
# successfully" in `docker compose logs -f app`.
#
# The bootstrap admin (account=admin) is self-seeded by the app on startup — no manual step and no
# separate seed container. The app checks on every boot and creates the admin from ADMIN_BOOTSTRAP_PASSWORD
# if none exists yet (idempotent no-op once it does).

# ============================================================================
# DEPLOYMENT CONFIG — edit the per-deploy values below, then `docker compose up -d`.
# Every value and mount is defined once in this block; the services below only reference them by name.
# This file is tracked in git and ships PLACEHOLDERS only (no secrets). After you fill in your real
# values locally, hide your edits from git so they're never committed back:
#   git update-index --skip-worktree docker-compose.yml      # reverse with --no-skip-worktree
# ============================================================================
x-config:
  # --- Per-deploy values (edit these) ---
  # REQUIRED — your federation IDENTITY domain: the <domain> in @user@<domain> handles and the keyId in
  # /.well-known/soms. This is the address peers look up (SRV _soms._tcp.<soms_domain>), NOT necessarily
  # the host they connect to — see soms_public_host. Immutable once users exist (renaming orphans peers).
  soms_domain: &soms_domain chat.example.com

  # REQUIRED — the hostname clients/browsers/peers actually CONNECT to (SRV target, TLS cert name, Caddy
  # bind). For the common single-domain case set this = soms_domain. Set a DIFFERENT host only for SRV
  # delegation: identity stays @user@<soms_domain> while the service is reached at <soms_public_host>:7667
  # (e.g. soms_domain=example.com + soms_public_host=soms.example.com, with SRV _soms._tcp.example.com → soms.example.com:7667).
  # See docs/federation-protocol.md Shape B (§D2).
  soms_public_host: &soms_public_host chat.example.com

  # REQUIRED for automatic HTTPS — a Cloudflare API token with Zone:DNS:Edit on your domain's zone
  # (Cloudflare dashboard → My Profile → API Tokens → Create Token). Leave empty ONLY if you bring your
  # own cert or switch DNS providers (then also edit ./Caddyfile's tls block and uncomment its bind-mount
  # on the app service below — no rebuild needed). See ./Caddyfile for the bundled provider list.
  cloudflare_api_token: &cf_token ""

  # OPTIONAL — PostgreSQL password. postgres is NOT published (compose-internal only); the default
  # (change-me) is fine for a single-host deploy. To use a different password, set POSTGRES_PASSWORD in
  # your environment or .env — it flows into the DB AND into database_url (auto-generated, bottom of this
  # block) in one shot. Do NOT hand-edit the `change-me` text or the `${ … }` wrapper here: change-me is
  # only the fallback default, and changing it here alone would desync from database_url below.
  postgres_password: &pg_pw ${POSTGRES_PASSWORD:-change-me}

  # OPTIONAL — Prisma connection-pool max. Keep (max × app replicas) ≤ PostgreSQL max_connections (100).
  database_pool_max: &pool_max 10

  # OPTIONAL — initial password for the bootstrap admin (account=admin). The app self-seeds it on startup
  # when no admin exists; once one exists this is ignored. Ships EMPTY on purpose — no placeholder password
  # is ever auto-applied. If left empty on a system with no admin, the app boots normally but logs a WARN
  # (the admin console has no login until you set this and restart).
  admin_bootstrap_password: &admin_pw ""

  # --- Fixed topology (same in every deploy; no need to edit) ---
  # app's unified persistent root: S2S + JWT keys, app logs (data/logs), Caddy state (data/caddy), uploads
  appdata_mount: &appdata_mount app-data:/app/data
  # PostgreSQL data directory (the chat database).
  pgdata_mount: &pgdata_mount pgdata:/var/lib/postgresql/data

  # --- DO NOT EDIT — derived from POSTGRES_PASSWORD above; shared by `migrate` and `app`. ---
  database_url: &db_url postgresql://timescale:${POSTGRES_PASSWORD:-change-me}@postgres:5432/soms?schema=public

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: soms
      POSTGRES_USER: timescale
      POSTGRES_PASSWORD: *pg_pw
    volumes:
      - *pgdata_mount
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timescale -d soms"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Reuses the app image (prisma CLI + migrations baked in) and applies pending migrations, then exits 0.
  # `prisma migrate deploy` is idempotent, so re-running `up` is a sub-second no-op when nothing is pending.
  migrate:
    image: soms:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *db_url
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"

  app:
    image: soms:latest
    # App waits for postgres healthy AND migrate to exit 0 — a failed migration keeps it down rather than
    # booting half-schema. (Admin self-seeding happens inside the app on startup, not as a compose dep.)
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true              # tini PID 1: reaps zombies, forwards SIGTERM to the entrypoint supervisor
    stop_grace_period: 15s
    environment:
      DATABASE_URL: *db_url
      SOMS_DOMAIN: *soms_domain
      SOMS_PUBLIC_HOST: *soms_public_host
      DATABASE_POOL_MAX: *pool_max
      CLOUDFLARE_API_TOKEN: *cf_token
      ADMIN_BOOTSTRAP_PASSWORD: *admin_pw
    volumes:
      - *appdata_mount
      # Uncomment to override the baked Caddyfile (REQUIRED for any non-Cloudflare DNS provider):
      # - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "7667:7667"      # HTTPS — web UI + API + SSE + federation S2S
      - "7667:7667/udp"  # HTTP/3 (QUIC); drop this line to disable h3
    restart: unless-stopped

volumes:
  pgdata:
  app-data:
