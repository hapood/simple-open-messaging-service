{
	storage file_system {
		root /app/data/caddy
	}
}
(soms_site) {
	tls {
		issuer acme {
			disable_http_challenge
		}
		issuer zerossl {env.CADDY_ZEROSSL_API_KEY}
	}
	route {
		encode zstd gzip
		@identity_application {
			host test.local
			not path /somfp/*
		}
		@application_federation {
			not host test.local
			path /somfp/*
		}
		handle @identity_application {
			respond 404
		}
		handle @application_federation {
			respond 404
		}
		handle /push/*.js {
			root * /app/public/web
			header Cache-Control "no-cache"
			file_server
		}
		# SOMFP discovery and versioned endpoints are served by Fastify.
		handle /somfp/* {
			reverse_proxy 127.0.0.1:3000
		}
		# Fastify origin on loopback: API (incl. SSE) + auth-gated /uploads (Caddy cannot do the cookie auth).
		handle /api* {
			reverse_proxy 127.0.0.1:3000
		}
		handle /uploads* {
			reverse_proxy 127.0.0.1:3000
		}
		# Frontend dist (baked into the image) — Caddy serves it; Fastify is API-only.
		redir /admin /admin/ 308
		handle /admin* {
			route {
				root * /app/public
				try_files {path} /admin/index.html
				header Cache-Control "no-cache"
				@admin_immutable path_regexp admin_immutable -[A-Za-z0-9_-]{8}\.[^/]+$
				header @admin_immutable Cache-Control "public, max-age=31536000, immutable"
				file_server
			}
		}
		handle {
			route {
				root * /app/public/web
				try_files {path} /index.html
				header Cache-Control "no-cache"
				@web_immutable path_regexp web_immutable -[A-Za-z0-9_-]{8}\.[^/]+$
				header @web_immutable Cache-Control "public, max-age=31536000, immutable"
				file_server
			}
		}
	}
}
https://test.local {
	import soms_site
}
https://test.local:7667 {
	import soms_site
}
https://www2.test.local {
	import soms_site
}
https://www2.test.local:7667 {
	import soms_site
}
